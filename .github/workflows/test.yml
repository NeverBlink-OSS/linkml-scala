name: Build & test

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-ci-pr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            java: 17
          - os: ubuntu-latest
            java: 25
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 256 # limits number of snapshots between releases
          fetch-tags: true # forces GitHub to fetch tags even on a partial history

      # Keeps extracted JDKs out of the cached coursier dir. See checks.yml
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup uv/python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          activate-environment: true

      - name: Install Python deps and generate cross-test models
        run: |
          uv pip install -r requirements.txt
          python cross_test.py 

      - name: Install the Mermaid ER diagram validator
        run: ./mill --no-server generator.jvm.test.mermaidValidator

      - name: Build and test
        run: |
          ./mill --no-server -j 0 __.test

      - name: Verify npm package (examples run + types compile)
        if: matrix.java == 17
        run: ./mill --no-server generator.js.verifyPackage

      - name: Re-generate the metamodel and check if it's unchanged
        run: |
          cp -r metamodel/ metamodel_prev/
          ./mill --no-server cli.jvm.run generate scala --to metamodel/src/eu/neverblink/linkml/metamodel/ linkml:meta
          ./mill --no-server metamodel.jvm.fix
          ./mill --no-server metamodel.jvm.reformat
          diff -r metamodel metamodel_prev
          
      - name: Publish Snapshot to Sonatype Central
        if: matrix.java == 17 && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          ./mill mill.javalib.SonatypeCentralPublishModule/

  nativelib:
    name: Shared library and Python bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Matters most here: the native-image build pulls a ~360 MB GraalVM tarball and unpacks it
      # to ~1 GB, and both copies would otherwise land in the cache. See checks.yml.
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup the oldest supported Python
        id: python-oldest
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Deliberately unpinned: test with newest Python stable
      - name: Setup the newest Python
        id: python-newest
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Regenerate the bindings and check they are committed
        run: |
          ./mill --no-server bindings
          git diff --exit-code -- python/linkml_scala/_generated.py \
            nativelib/src/eu/neverblink/linkml/nativelib/LinkMlCGenerators.java \
            || (echo "generated bindings are stale – run ./mill bindings and commit the result"; exit 1)

      - name: Build the shared library and test the bindings on the oldest supported Python
        env:
          PYTHON: ${{ steps.python-oldest.outputs.python-path }}
        run: ./mill --no-server nativelib.pythonTest

      - name: Test the bindings on the newest Python
        env:
          PYTHON: ${{ steps.python-newest.outputs.python-path }}
        run: ./mill --no-server nativelib.pythonTest

      # Builds the wheel that gets published on release, installs it into a clean virtualenv and
      # runs it from there, so the packaging is tested and not just the sources.
      - name: Build the Python wheel and test the installed package
        env:
          PYTHON: ${{ steps.python-oldest.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install --quiet build
          ./mill --no-server nativelib.pythonWheelTest

      # The wheel Linux users actually get: linked inside manylinux2014 so it runs on far older
      # distributions than this runner. Exercised here so that a release is not the first time it
      # runs. See nativelib/build-shared.sh.
      - name: Build the manylinux wheel and test the installed package
        env:
          PYTHON: ${{ steps.python-oldest.outputs.python-path }}
        run: ./mill --no-server nativelib.linux.glibc.pythonWheelTest

      - name: Build the musl wheel and test it in Alpine
        env:
          PYTHON: ${{ steps.python-oldest.outputs.python-path }}
        run: |
          sudo nativelib/install-musl-toolchain.sh
          ./mill --no-server nativelib.linux.musl.pythonWheel
          wheel="$(ls out/nativelib/linux/musl/pythonWheel.dest/dist/*.whl)"
          docker run --rm -v "$PWD:/work:ro" -e LINKML_SCALA_REPO=/work python:3.12-alpine sh -c "
            set -e
            pip install --quiet '/work/$wheel'
            cp /work/python/test_bindings.py /tmp/
            cd /tmp && python -m unittest test_bindings -v"

      # Builds the release archive, then compiles and runs a C program against the unpacked copy.
      - name: Check that the release archive works from C
        run: |
          nativelib/package.sh 0.0.0-ci linux-x86_64 out/nativelib/sharedLibrary.dest dist
          tar -xzf dist/linkml-scala-lib-linux-x86_64.tar.gz -C dist
          nativelib/smoke.sh dist/liblinkml-scala-0.0.0-ci-linux-x86_64

      - name: Check that the pkg-config file resolves
        run: |
          prefix="$PWD/dist/liblinkml-scala-0.0.0-ci-linux-x86_64"
          flags=$(PKG_CONFIG_PATH="$prefix" pkg-config --cflags --libs linkml-scala)
          echo "pkg-config: $flags"
          gcc nativelib/smoke.c -o dist/smoke-pc $flags
          LD_LIBRARY_PATH="$prefix/lib" dist/smoke-pc    
