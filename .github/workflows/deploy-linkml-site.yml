# Publish the landing page, the playground and the docs at https://linkml.ohi.dev/.
name: Deploy linkml.ohi.dev

on:
  push:
    branches: [ "main" ]
    # Folders that aren't used for building the site
    paths-ignore:
      - ".agents/**"
      - ".claude-plugin/**"
      - "benchmark/**"
      - "cli/**"
      - "nativelib/**"
      - "ohi/**"
      - "python/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The landing page's install lines need the latest release tag. Without
          # tags the playground shows 0.0.0-SNAPSHOT in its footer and build info dialog.
          fetch-depth: 256
          fetch-tags: true

      # Keeps extracted JDKs out of the cached coursier dir. See checks.yml
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8
        # Also hash the build files that declare dependencies: by default only build.mill and
        # ./mill are hashed, so a new dependency would be downloaded again on every run.
        with:
          extraFiles: '["**/package.mill", "mill-build/src/**/*.scala", "!out/**", "!.bsp/**"]'

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build site
        run: ./mill --no-server ui.site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/ui/site.dest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
