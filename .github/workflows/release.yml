name: Publish release
on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with 'v', like v1.0.0 or v2.1.3-rc1

jobs:
  jar-assemble:
    # Separate workflow to speed up library publishing
    name: Assemble and upload library/cli JARs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required so Mill can see the full Git history and tags

      # Keeps extracted JDKs out of the cached coursier dir. See checks.yml
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17 # The minimal JDK version for Scala Next

      - name: Assembly Uber-JAR
        run: |
          ./mill cli.jvm.assembly
          mv out/cli/jvm/assembly.dest/*.jar linkml-scala.jar

      - name: Upload Uber-JAR
        uses: actions/upload-artifact@v7
        with:
          name: linkml-scala-assembly
          path: linkml-scala.jar

  aot-compile:
    name: AOT compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Oldest available image per platform, so the binaries stay usable on older systems.
        os: [macos-14, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Matters most here: nativeImage pulls a ~360 MB GraalVM tarball and unpacks it
      # to ~1 GB, and both copies used to land in the cache. See checks.yml.
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17 # The minimal JDK version for Scala Next

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1 # Required by GraalVM Native Image on Windows to find cl.exe

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Build Native Executable with Mill
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./mill.bat cli.jvm.nativeImage
          else
            ./mill cli.jvm.nativeImage
          fi

      - name: Smoke Tests for Executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            BIN_PATH="./out/cli/jvm/nativeImage.dest/linkml-scala.exe"
          else
            BIN_PATH="./out/cli/jvm/nativeImage.dest/linkml-scala"
          fi
          OUTPUT=$($BIN_PATH validate tests/resources/models/basic/model.yaml)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -Fq "Schema is valid."; then
            echo "Error: Expected success message not found."
            exit 1 # Forces the GitHub Action step to fail
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: linkml-scala-${{ matrix.os }}
          path: out/cli/jvm/nativeImage.dest/*

      - name: Build Shared Library and Test the Python Bindings
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./mill.bat nativelib.pythonTest
          else
            ./mill nativelib.pythonTest
          fi

      - name: Pick the Shared Library This Platform Ships
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "LIB_MODULE=nativelib.linux.glibc" >> "$GITHUB_ENV"
            echo "LIB_DEST=out/nativelib/linux/glibc/sharedLibrary.dest" >> "$GITHUB_ENV"
            echo "WHEEL_DEST=out/nativelib/linux/glibc/pythonWheel.dest/dist" >> "$GITHUB_ENV"
          else
            echo "LIB_MODULE=nativelib" >> "$GITHUB_ENV"
            echo "LIB_DEST=out/nativelib/sharedLibrary.dest" >> "$GITHUB_ENV"
            echo "WHEEL_DEST=out/nativelib/pythonWheel.dest/dist" >> "$GITHUB_ENV"
          fi

      - name: Build the Shipped Shared Library (Linux only)
        if: runner.os == 'Linux'
        run: ./mill nativelib.linux.glibc.sharedLibrary

      # The archive is what people actually download, so build it here and check a C program can
      # compile against it and run. This is the only place the Windows import library and the
      # macOS dylib get tested.
      - name: Check the Release Archive Works from C
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "${{ matrix.os }}" in
          macos-14) platform=macos-arm64 ;;
          macos-15-intel) platform=macos-x86_64 ;;
          ubuntu-22.04) platform=linux-x86_64 ;;
          ubuntu-22.04-arm) platform=linux-arm64 ;;
          windows-latest) platform=windows-x86_64 ;;
          esac
          nativelib/package.sh "$version" "$platform" "$LIB_DEST" dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            unzip -q "dist/linkml-scala-lib-$platform.zip" -d dist
          else
            tar -xzf "dist/linkml-scala-lib-$platform.tar.gz" -C dist
          fi
          nativelib/smoke.sh "dist/liblinkml-scala-$version-$platform"

      - name: Upload Shared Library
        uses: actions/upload-artifact@v7
        with:
          name: linkml-nativelib-${{ matrix.os }}
          path: ${{ env.LIB_DEST }}/*

      - name: Build the Python Wheel and Test the Installed Package
        shell: bash
        env:
          PYTHON: python # so `pip install build` and Mill use the same interpreter on every OS
        run: |
          python -m pip install --quiet build
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./mill.bat "$LIB_MODULE.pythonWheelTest"
          else
            ./mill "$LIB_MODULE.pythonWheelTest"
          fi

      - name: Upload Python Wheel
        uses: actions/upload-artifact@v7
        with:
          name: linkml-wheel-${{ matrix.os }}
          path: ${{ env.WHEEL_DEST }}/*.whl

      # musl is cross-compiled on Linux
      - name: Build the musl Wheel (Linux only)
        if: runner.os == 'Linux'
        env:
          PYTHON: python
        run: |
          sudo nativelib/install-musl-toolchain.sh
          ./mill nativelib.linux.musl.pythonWheel

      # we must run musl binary in a musl container
      - name: Test the musl Wheel in Alpine (Linux only)
        if: runner.os == 'Linux'
        run: |
          wheel="$(ls out/nativelib/linux/musl/pythonWheel.dest/dist/*.whl)"
          docker run --rm -v "$PWD:/work:ro" -e LINKML_SCALA_REPO=/work python:3.12-alpine sh -c "
            set -e
            pip install --quiet '/work/$wheel'
            cp /work/python/test_bindings.py /tmp/
            cd /tmp && python -m unittest test_bindings -v"

      - name: Upload musl Python Wheel
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linkml-wheel-musl-${{ matrix.os }}
          path: out/nativelib/linux/musl/pythonWheel.dest/dist/*.whl

  publish:
    name: Publish to Maven and GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required by actions/attest to mint a Sigstore OIDC token
      attestations: write # Required to record the provenance attestation on the repo
    needs:
      - aot-compile
      - jar-assemble

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required so Mill can see the full Git history and tags

      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: linkml-scala-*
          path: bin
          
      - name: Rename Binaries
        run: |
          mv bin/linkml-scala-assembly/linkml-scala.jar linkml-scala.jar
          mv bin/linkml-scala-macos-14/linkml-scala linkml-scala-macos-arm64
          mv bin/linkml-scala-macos-15-intel/linkml-scala linkml-scala-macos-x86_64
          mv bin/linkml-scala-ubuntu-22.04/linkml-scala linkml-scala-linux-x86_64
          mv bin/linkml-scala-ubuntu-22.04-arm/linkml-scala linkml-scala-linux-arm64
          mv bin/linkml-scala-windows-latest/linkml-scala.exe linkml-scala-windows-x86_64.exe
          chmod +x linkml-scala-macos-arm64
          chmod +x linkml-scala-macos-x86_64
          chmod +x linkml-scala-linux-x86_64
          chmod +x linkml-scala-linux-arm64

      - name: Create Gzipped Versions
        run: |
          gzip -9 -k linkml-scala-macos-arm64 &
          gzip -9 -k linkml-scala-macos-x86_64 &
          gzip -9 -k linkml-scala-linux-x86_64 &
          gzip -9 -k linkml-scala-linux-arm64 &
          gzip -9 -k linkml-scala-windows-x86_64.exe &
          wait

      - name: Download Shared Libraries
        uses: actions/download-artifact@v8
        with:
          pattern: linkml-nativelib-*
          path: nativelib-builds

      # Packaged here rather than on each runner so every archive is built by the same tar/zip.
      # The layout is the usual include/ + lib/ install prefix, see nativelib/package.sh.
      - name: Package Shared Libraries
        run: |
          version="${GITHUB_REF_NAME#v}"
          package() {
            nativelib/package.sh "$version" "$2" "nativelib-builds/linkml-nativelib-$1" .
          }
          package macos-14          macos-arm64
          package macos-15-intel    macos-x86_64
          package ubuntu-22.04      linux-x86_64
          package ubuntu-22.04-arm  linux-arm64
          package windows-latest    windows-x86_64

      # See: docs/verifying_downloads.md
      - name: Generate Checksums
        run: sha256sum linkml-scala* | tee SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            linkml-scala*
            SHA256SUMS

      - name: Upload Binaries
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          artifacts: "linkml-scala*,SHA256SUMS"
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

      - name: Publish to Maven Central
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: ./mill mill.javalib.SonatypeCentralPublishModule/

  pypi-publish:
    name: Publish Python wheels to PyPI
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download Wheels
        uses: actions/download-artifact@v8
        with:
          pattern: linkml-wheel-*
          path: wheels
          merge-multiple: true

      - name: List Wheels
        run: ls -l wheels

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true

  npm-publish:
    # Independent of the JVM/native jobs: publishes the Scala.js library to npm.
    # Uses npm trusted publishing (OIDC).
    name: Publish JS library to npm
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required so Mill can derive the version from Git tags

      # Keeps extracted JDKs out of the cached coursier dir; see checks.yml
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 # >= 22.14.0 required by trusted publishing

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest # Trusted publishing needs npm >= 11.5.1

      - name: Assemble npm package
        run: ./mill generator.js.npmPackage

      - name: Verify npm package (examples run + types compile)
        run: ./mill generator.js.verifyPackage

      - name: Publish to npm
        working-directory: out/generator/js/npmPackage.dest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *SNAPSHOT* ]]; then TAG=next; else TAG=latest; fi
          echo "Publishing @neverblink/linkml@$VERSION under dist-tag $TAG"
          npm publish --tag "$TAG"
