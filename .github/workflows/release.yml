name: Publish release
on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with 'v', like v1.0.0 or v2.1.3-rc1

permissions:
  contents: read

jobs:
  jar-assemble:
    # Separate workflow to speed up library publishing
    name: Assemble and upload library/cli JARs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required so Mill can see the full Git history and tags

      # Keeps extracted JDKs out of the cached coursier dir. See checks.yml
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17 # The minimal JDK version for Scala Next

      - name: Assembly Uber-JAR
        run: |
          ./mill cli.jvm.assembly
          mv out/cli/jvm/assembly.dest/*.jar linkml-scala.jar
          ./mill cli.ohi.jvm.assembly
          mv out/cli/ohi/jvm/assembly.dest/*.jar ohi.jar

      - name: Upload Uber-JAR
        uses: actions/upload-artifact@v7
        with:
          name: linkml-scala-assembly
          path: linkml-scala.jar

      - name: Upload Ohi JAR
        uses: actions/upload-artifact@v7
        with:
          name: ohi-assembly
          path: ohi.jar
          if-no-files-found: error

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build Ohi Python distributions
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m pip install --quiet build twine
          bash cli/package-ohi.sh python "$RUNNER_TEMP/ohi-python" "$version"
          python -m twine check "$RUNNER_TEMP/ohi-python/"*
      - name: Upload Ohi Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: ohi-python
          path: ${{ runner.temp }}/ohi-python/*
          if-no-files-found: error

  aot-compile:
    uses: ./.github/workflows/cli-native.yml

  wheels:
    # The library, the release archives, the wheels and the source distribution.
    # This can be tested in PRs – see native-build.yml.
    name: Wheels
    uses: ./.github/workflows/wheels.yml

  publish:
    if: github.repository == 'NeverBlink-OSS/linkml-scala'
    name: Publish to Maven and GitHub
    runs-on: ubuntu-latest
    env:
      LINKML_NATIVE: "1"
    permissions:
      contents: write
      id-token: write # Required by actions/attest to mint a Sigstore OIDC token
      attestations: write # Required to record the provenance attestation on the repo
    needs:
      - aot-compile
      - jar-assemble
      - wheels

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required so Mill can see the full Git history and tags

      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: '{linkml-scala,ohi}-*'
          path: bin

      - name: Rename Binaries
        run: |
          for tool in linkml-scala ohi; do
            mv "bin/$tool-assembly/$tool.jar" "$tool.jar"
            mv "bin/$tool-macos-15/$tool" "$tool-macos-arm64"
            mv "bin/$tool-macos-15-intel/$tool" "$tool-macos-x86_64"
            mv "bin/$tool-ubuntu-22.04/$tool" "$tool-linux-x86_64"
            mv "bin/$tool-ubuntu-22.04-arm/$tool" "$tool-linux-arm64"
            mv "bin/$tool-windows-latest/$tool.exe" "$tool-windows-x86_64.exe"
            chmod +x "$tool"-macos-* "$tool"-linux-*
          done

      - name: Create Gzipped Versions
        run: |
          for tool in linkml-scala ohi; do
            for platform in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64 windows-x86_64.exe; do
              gzip -9 -k "$tool-$platform"
            done
          done

      - name: Download Shared Libraries
        uses: actions/download-artifact@v8
        with:
          pattern: linkml-nativelib-*
          path: nativelib-builds

      # Packaged here rather than on each runner so every archive is built by the same tar/zip.
      # The layout is the usual include/ + lib/ install prefix, see nativelib/package.sh.
      - name: Package Shared Libraries
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64 \
                          windows-x86_64 windows-arm64; do
            nativelib/package.sh "$version" "$platform" \
              "nativelib-builds/linkml-nativelib-$platform" .
          done

      # See: docs/verifying_downloads.md
      - name: Generate Checksums
        run: sha256sum linkml-scala* ohi-* ohi.jar | tee SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            linkml-scala*
            ohi-*
            ohi.jar
            SHA256SUMS

      - name: Upload Binaries
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          artifacts: "linkml-scala*,ohi-*,ohi.jar,SHA256SUMS"
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

      - name: Publish to Maven Central
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: ./mill mill.javalib.SonatypeCentralPublishModule/

  pypi-publish:
    name: Publish Python wheels to PyPI
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download Wheels
        uses: actions/download-artifact@v8
        with:
          pattern: linkml-wheel-*
          path: wheels
          merge-multiple: true

      - name: Download Source Distribution
        uses: actions/download-artifact@v8
        with:
          name: linkml-sdist
          path: wheels

      - name: Download Ohi distributions
        uses: actions/download-artifact@v8
        with:
          name: ohi-python
          path: ohi-dist

      - name: List Distributions
        run: ls -l wheels ohi-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true

      # Separate upload, so a rejected Ohi file cannot stop the LinkML files.
      - name: Publish Ohi to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ohi-dist
          skip-existing: true

  npm-publish:
    # Independent of the JVM/native jobs: publishes the Scala.js library to npm.
    # Uses npm trusted publishing (OIDC).
    name: Publish JS library to npm
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required so Mill can derive the version from Git tags

      # Keeps extracted JDKs out of the cached coursier dir; see checks.yml
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 # >= 22.14.0 required by trusted publishing

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest # Trusted publishing needs npm >= 11.5.1

      - name: Assemble npm package
        run: ./mill generator.js.npmPackage

      - name: Verify npm package (examples run + types compile)
        run: ./mill generator.js.verifyPackage

      - name: Publish to npm
        working-directory: out/generator/js/npmPackage.dest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "Publishing @neverblink/linkml@$VERSION under dist-tag $TAG"
          npm publish --tag "$TAG"

  npm-publish-ohi:
    name: Publish Ohi TypeScript SDK
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ohi/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Build and test package
        run: |
          npm ci
          npm test
      - name: Publish package
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash cli/package-ohi.sh npm "$RUNNER_TEMP/ohi-npm" "$version"
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish "$RUNNER_TEMP"/ohi-npm/neverblink-ohi-*.tgz --tag "$tag"

  verify-ohi-install:
    name: Verify released Ohi on ${{ matrix.os }}
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-latest]
    env:
      LINKML_SCALA_VERSION: ${{ github.ref_name }}
      LINKML_SCALA_TOOL: ohi
      LINKML_SCALA_REQUIRE_CHECKSUM: '1'
      LINKML_SCALA_REQUIRE_ATTESTATION: '1'
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Select installation directory
        run: echo "LINKML_SCALA_INSTALL_DIR=$RUNNER_TEMP/ohi-installed" >> "$GITHUB_ENV"
      - name: Install exact release with checksum and provenance required
        if: runner.os != 'Windows'
        run: |
          bash cli/install.sh
          python cli/check-ohi.py "$LINKML_SCALA_INSTALL_DIR/ohi" "${LINKML_SCALA_VERSION#v}"
      - name: Download and verify Windows executable
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$LINKML_SCALA_INSTALL_DIR"
          cd "$LINKML_SCALA_INSTALL_DIR"
          release="https://github.com/NeverBlink-OSS/linkml-scala/releases/download/$LINKML_SCALA_VERSION"
          curl -fL "$release/ohi-windows-x86_64.exe" -o ohi.exe
          curl -fL "$release/SHA256SUMS" -o SHA256SUMS
          expected=$(awk '$2 == "ohi-windows-x86_64.exe" { print $1 }' SHA256SUMS)
          actual=$(sha256sum ohi.exe | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          gh attestation verify ohi.exe --repo NeverBlink-OSS/linkml-scala
      - name: Check installed Windows executable
        if: runner.os == 'Windows'
        run: python cli/check-ohi.py "$LINKML_SCALA_INSTALL_DIR/ohi.exe" "${LINKML_SCALA_VERSION#v}"
