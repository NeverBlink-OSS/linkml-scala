name: Windows shared library

# test-build the Windows shared library if the native build files have changed
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'nativelib/**'
      - 'python/**'
      - 'build.mill'
      - 'mill-build/**'
      - '.github/workflows/nativelib-windows.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'nativelib/**'
      - 'python/**'
      - 'build.mill'
      - 'mill-build/**'
      - '.github/workflows/nativelib-windows.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nativelib-windows:
    name: Shared library and wheel on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Relocate the coursier archive cache
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Build the shared library and test the Python bindings
        run: ./mill.bat nativelib.pythonTest

      - name: Check that the release archive works from C
        run: |
          nativelib/package.sh 0.0.0-ci windows-x86_64 out/nativelib/sharedLibrary.dest dist
          # Use Windows' bsdtar, which can read zip (the default is GNU tar, which cannot)
          /c/Windows/System32/tar.exe -xf dist/linkml-scala-lib-windows-x86_64.zip -C dist
          nativelib/smoke.sh dist/liblinkml-scala-0.0.0-ci-windows-x86_64

      - name: Build the Python wheel and test the installed package
        env:
          PYTHON: python # so `pip install build` and Mill use the same interpreter
        run: |
          python -m pip install --quiet build
          ./mill.bat nativelib.pythonWheelTest
