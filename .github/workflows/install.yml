name: Test install script

# Verifies that `cli/install.sh` actually installs a working binary on every
# platform it claims to support.

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cli/install.sh'
      - '.github/workflows/install.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-ci-pr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-script:
    name: install.sh on ${{ matrix.os }}
    # Don't burn scheduled runs on forks, which have no releases to install.
    if: github.event_name != 'schedule' || github.repository == 'NeverBlink-OSS/linkml-scala'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform with a published release asset that install.sh supports.
        os: [ ubuntu-latest, ubuntu-22.04-arm, macos-14 ]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # The invocation documented in README. Sourcing also puts the install dir on PATH
      # for the rest of this step, which executing the script cannot do.
      - name: Install via install.sh
        run: |
          . ./cli/install.sh
          command -v linkml-scala # sourcing must make it callable immediately
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The other documented form. Must work without a TTY and without prompting.
      - name: Install via install.sh, executed rather than sourced
        run: |
          LINKML_SCALA_INSTALL_DIR="$RUNNER_TEMP/linkml-exec" bash ./cli/install.sh
          "$RUNNER_TEMP/linkml-exec/linkml-scala" --version

      # A sourced install.sh must never terminate the caller's shell.
      - name: Sourcing install.sh survives a failure
        run: |
          LINKML_SCALA_VERSION=v0.0.0-does-not-exist
          export LINKML_SCALA_VERSION
          . ./cli/install.sh && { echo "Error: expected a non-zero status."; exit 1; }
          echo "Still alive after a failed source, as expected."

      - name: Installed binary reports its version
        run: |
          linkml-scala --version

      - name: Installed binary can validate a schema
        run: |
          OUTPUT=$(linkml-scala validate tests/resources/models/basic/model.yaml)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -Fq "Schema is valid."; then
            echo "Error: Expected success message not found."
            exit 1
          fi
