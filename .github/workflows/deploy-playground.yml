name: Deploy playground

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keeps extracted JDKs out of the cached coursier dir. See checks.yml
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build browser UI
        run: |
          ./mill --no-server generator.js.fullLinkJS
          ./mill --no-server uiBundle

      - name: Assemble playground site
        run: |
          mkdir -p site/playground/dist
          cp ui/index.html ui/styles.css ui/neverblink-logo.svg site/playground/
          cp ui/favicon.svg ui/favicon.ico ui/apple-touch-icon.png site/playground/
          cp ui/favicon.svg ui/favicon.ico ui/apple-touch-icon.png site/
          cp -R ui/dist/. site/playground/dist/
          cp CNAME site/CNAME
          cp pages/index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
