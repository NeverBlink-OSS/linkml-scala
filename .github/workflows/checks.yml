name: Code checks

on:
  pull_request:
    branches: [ "main" ]
    # Skip changes to only the sites. Those are checked in site-checks.yml.
    paths:
      - '**'
      - '!pages/**'
      - '!ui/**'
      - '!website/**'
      - '!ohi/docs/**'
      - '!*.md'

concurrency:
  group: ${{ github.workflow }}-ci-pr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scalafmt-lint:
    name: Scalafmt lint
    runs-on: ubuntu-latest
    env:
      LINKML_NATIVE: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Coursier unpacks every JDK it fetches (Temurin here, GraalVM in the release
      # workflow) into ~/.cache/coursier/arc, so cache-action uploads each one twice:
      # once as the downloaded archive, once extracted. That dwarfs the ~50 MB of jars
      # we actually want cached. Park the extracted copies in the runner temp dir, which
      # is never cached. Re-extracting is far cheaper than shipping GBs each run.
      - name: Relocate the coursier archive cache
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8
        # Also hash the build files that declare dependencies: by default only build.mill and
        # ./mill are hashed, so a new dependency would be downloaded again on every run.
        with:
          extraFiles: '["**/package.mill", "mill-build/src/**/*.scala", "!out/**", "!.bsp/**"]'

      - name: Run scalafmt
        run: |
          ./mill --no-server __.jvm.__.checkFormat
          ./mill --no-server __.js.__.checkFormat
          ./mill --no-server __.native.__.checkFormat
          ./mill --no-server agents.__.checkFormat


  scalafix-lint:
    name: Scalafix lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      LINKML_NATIVE: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Relocate the coursier archive cache # see scalafmt-lint
        shell: bash
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8
        # Also hash the build files that declare dependencies: by default only build.mill and
        # ./mill are hashed, so a new dependency would be downloaded again on every run.
        with:
          extraFiles: '["**/package.mill", "mill-build/src/**/*.scala", "!out/**", "!.bsp/**"]'

      - name: Run scalafix
        # Shared sources are checked on JVM. JS and Native only for modules with src-js / src-native
        # or native-only modules. Update this list when adding such sources.
        run: |
          ./mill --no-server __.jvm.__.fix --check
          ./mill --no-server generator.js.fix --check + schemaview.js.__.fix --check
          # Native modules cannot be compiled in parallel; see CommonScalaNativeModule in build.mill.
          ./mill --no-server -j 1 schemaview.native.__.fix --check + nativelib.native.fix --check
