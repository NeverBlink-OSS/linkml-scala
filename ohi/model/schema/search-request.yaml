id: https://ohi.neverblink.eu/contracts/search-request
name: ohi_search_request
title: Publication search request
description: Search query, filters, facets, ordering and pagination for ontology publications.
status: draft
prefixes:
  ohi: https://ohi.neverblink.eu/contracts/
  linkml: https://w3id.org/linkml/
default_prefix: ohi
imports:
- linkml:types
classes:
  SearchRequest:
    description: Query and options for retrieving one page of ontology publications.
    attributes:
      q:
        description: Text query over the configured search fields. Use the wildcard * for browsing.
        range: string
        required: true
        pattern: ^[\s\S]*\S
      page:
        description: One-based page number. Omitted means 1.
        range: integer
        minimum_value: 1
      per_page:
        description: Maximum hits requested for this page, from 1 through 250. Omitted means 10.
        range: integer
        minimum_value: 1
        maximum_value: 250
      filter_by:
        description: Typesense filter expression over filterable fields.
        range: string
        pattern: ^[\s\S]*\S
      sort_by:
        description: Typesense sort expression. Omitted preserves default search ordering.
        range: string
        pattern: ^[\s\S]*\S
      facet_by:
        description: Typesense facet expression over facetable fields.
        range: string
        pattern: ^[\s\S]*\S
      max_facet_values:
        description: Maximum values returned per facet. Omitted uses the backend default.
        range: integer
        minimum_value: 1
    tree_root: true
