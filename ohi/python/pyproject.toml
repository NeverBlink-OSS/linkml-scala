[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neverblink-ohi"
version = "0.0.0"
description = "Ohi catalog search, publication inspection and artifact retrieval."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "NeverBlink" }]
dependencies = ["pydantic>=2.12,<3", "jsonschema[format-nongpl]>=4.26,<5"]

[project.urls]
Documentation = "https://github.com/NeverBlink-OSS/linkml-scala/blob/main/ohi/README.md"
Source = "https://github.com/NeverBlink-OSS/linkml-scala"
Issues = "https://github.com/NeverBlink-OSS/linkml-scala/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ohi"]
