id: https://ohi.neverblink.eu/contracts/cli-download-fields
name: ohi_cli_download_fields
title: CLI verified file outputs
description: Completed ontology files shared by download and project results.
prefixes:
  ohi: https://ohi.neverblink.eu/contracts/
default_prefix: ohi
imports:
- cli-delivery
slots:
  files:
    description: Completed outputs in first-occurrence lock order.
    range: LockFileResult
    required: true
    multivalued: true
    list_elements_ordered: true
    inlined_as_list: true
classes:
  LockFileResult:
    description: A file matching its recorded SHA-256.
    is_a: DeliveryResult
    slot_usage:
      url:
        description: First recorded URL for this output.
    attributes:
      status:
        range: LockFileStatus
        required: true
enums:
  LockFileStatus:
    permissible_values:
      DOWNLOADED:
        description: Downloaded, verified and saved.
      VERIFIED:
        description: Existing file verified unchanged.
