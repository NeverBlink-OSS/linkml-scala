id: https://ohi.neverblink.eu/contracts/lock
name: ohi_lock
title: Supplied complete file lock
description: Selected publications and their artifact files.
prefixes:
  ohi: https://ohi.neverblink.eu/contracts/
default_prefix: ohi
imports:
- selection
classes:
  Lock:
    description: Direct selections and their artifact files.
    tree_root: true
    slots:
    - selections
    attributes:
      format_version:
        description: Version 1 omits file hashes. Version 2 requires sha256 for every file.
        range: integer
        required: true
        minimum_value: 1
        maximum_value: 2
      files:
        description: Each (base_url, url) pair is unique. Every selection matches a file by that pair.
        range: LockedFile
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        list_elements_ordered: true
  LockedFile:
    is_a: ArtifactSelection
    slots:
    - format
    - sha256
    slot_usage:
      base_url:
        rank: 0
      format:
        rank: 1
      url:
        rank: 2
