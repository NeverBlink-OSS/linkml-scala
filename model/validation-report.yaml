id: https://linkml.neverblink.eu/model/validation-report
name: validation-report
title: Schema for LinkML validation reports
description: |
  TODO
license: https://creativecommons.org/publicdomain/zero/1.0/
imports:
  - linkml:types

classes:
  IssueLocation:
    abstract: true
    title: Issue location
    description: |
      A location in a schema where an issue was found.
    attributes:
      schema_id:
        range: uri
        recommended: true
        title: schema identifier
        description: >
          The identifier of the schema in which the issue was found.
          Always present, unless the issue pertains to the lack of the identifier itself.
      schema_path: # todo: can we do this? this depends a bit on the importer

  JsonPathIssueLocation:
    is_a: IssueLocation
    title: JSONPath issue location
    description: |
      A location in a schema where an issue was found, expressed as a JSONPath.
    attributes: { } # TODO, there is a jsonpath type we can use
