id: https://linkml.ohi.dev/model/converter/generator/rdfs
name: rdfs-generator
prefixes:
  converter: https://linkml.ohi.dev/model/converter#
default_prefix: converter
imports:
  - ../shared

classes:
  RdfsGeneratorOptions:
    description: Options of the RDFS generator.
    mixins: [RdfOptions]
    slots:
      - only_classes_from_root_schema
    slot_usage:
      only_classes_from_root_schema:
        examples:
          - value: true

functions:
  rdfs:
    description: Generate RDFS, serialized as N-Triples or Turtle.
    parameters: RdfsGeneratorOptions
    returns: string
