version: 0.2.0.dev0
name: prov
prefixes:
  prov: http://www.w3.org/ns/prov#
ontology:
  - concept: Activity
    type: EntityType
    iri: prov:Activity
    description: Something that occurs over a period of time and acts upon or with entities.
    identify_by:
      - id
    requires:
      - Activity.id
    relationships:
      - name: ended_at_time
        iri: prov:endedAtTime
        roles:
          - concept: DateTime
        multiplicity: ManyToOne
        verbalizes:
          - "{Activity} ended at time {DateTime}"
      - name: id
        iri: prov:id
        roles:
          - concept: String
        multiplicity: OneToOne
        verbalizes:
          - "{Activity} id {String}"
      - name: started_at_time
        iri: prov:startedAtTime
        roles:
          - concept: DateTime
        multiplicity: ManyToOne
        verbalizes:
          - "{Activity} started at time {DateTime}"
      - name: used
        iri: prov:used
        roles:
          - concept: Entity
        verbalizes:
          - "{Activity} used {Entity}"
      - name: was_associated_with
        iri: prov:wasAssociatedWith
        roles:
          - concept: Agent
        verbalizes:
          - "{Activity} was associated with {Agent}"
  - concept: Agent
    type: EntityType
    iri: prov:Agent
    description: Something that bears some form of responsibility for an activity taking place, for the existence of an entity, or for another agent's activity.
    identify_by:
      - id
    requires:
      - Agent.id
    relationships:
      - name: acted_on_behalf_of
        iri: prov:actedOnBehalfOf
        roles:
          - concept: Agent
            name: acted_on_behalf_of
        multiplicity: ManyToOne
        verbalizes:
          - "{Agent} acted on behalf of {Agent:acted_on_behalf_of}"
      - name: id
        iri: prov:id
        roles:
          - concept: String
        multiplicity: OneToOne
        verbalizes:
          - "{Agent} id {String}"
  - concept: Entity
    type: EntityType
    iri: prov:Entity
    description: A physical, digital, conceptual, or other kind of thing with some fixed aspects; entities may be real or imaginary.
    identify_by:
      - id
    requires:
      - Entity.id
    relationships:
      - name: id
        iri: prov:id
        roles:
          - concept: String
        multiplicity: OneToOne
        verbalizes:
          - "{Entity} id {String}"
      - name: was_attributed_to
        iri: prov:wasAttributedTo
        roles:
          - concept: Agent
        multiplicity: ManyToOne
        verbalizes:
          - "{Entity} was attributed to {Agent}"
      - name: was_generated_by
        iri: prov:wasGeneratedBy
        roles:
          - concept: Activity
        multiplicity: ManyToOne
        verbalizes:
          - "{Entity} was generated by {Activity}"
