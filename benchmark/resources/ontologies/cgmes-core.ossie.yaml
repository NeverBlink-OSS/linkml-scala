        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} long pf {Float}"
      - name: maxOperatingP
        iri: cim:GeneratingUnit.maxOperatingP
        description: This is the maximum operating active power limit the dispatcher can enter for this unit.
        roles:
