    type: EntityType
    iri: cim:DCConverterUnit
    description: Indivisible operative unit comprising all equipment between the point of common coupling on the AC side and the point of common coupling – DC side, essentially one or more converters, together with one or more converter transformers, converter control equipment, essential protective and switching devices and auxiliaries, if any, used for conversion.
    extends:
      - DcEquipmentContainer
    requires:
      - DcConverterUnit.operationMode
    relationships:
      - name: Substation
        iri: cim:DCConverterUnit.Substation
        description: The containing substation of the DC converter unit.
        roles:
          - concept: Substation
        multiplicity: ManyToOne
        verbalizes:
          - "{DcConverterUnit} substation {Substation}"
      - name: operationMode
        iri: cim:DCConverterUnit.operationMode
        description: The operating mode of an HVDC bipole (bipolar, monopolar metallic return, etc).
        roles:
          - concept: DcConverterOperatingModeKind
        multiplicity: ManyToOne
        verbalizes:
          - "{DcConverterUnit} operation mode {DcConverterOperatingModeKind}"
  - concept: DcDisconnector
    type: EntityType
    iri: cim:DCDisconnector
    description: A disconnector within a DC system.
    extends:
      - DcSwitch
  - concept: DcEquipmentContainer
    type: EntityType
    iri: cim:DCEquipmentContainer
    description: A modelling construct to provide a root class for containment of DC as well as AC equipment. The class differ from the EquipmentContaner for AC in that it may also contain DCNode-s. Hence it can contain both AC and DC equipment.
    extends:
      - EquipmentContainer
    relationships:
      - name: DCNodes
        iri: cim:DCEquipmentContainer.DCNodes
        description: The DC nodes contained in the DC equipment container.
        roles:
          - concept: DcNode
        verbalizes:
          - "{DcEquipmentContainer} dc nodes {DcNode}"
  - concept: DcGround
    type: EntityType
    iri: cim:DCGround
    description: A ground within a DC system.
    extends:
      - DcConductingEquipment
    relationships:
      - name: inductance
        iri: cim:DCGround.inductance
        description: Inductance to ground.
        roles:
          - concept: Inductance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcGround} inductance {Inductance}"
      - name: r
        iri: cim:DCGround.r
        description: Resistance to ground.
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcGround} r {Resistance}"
  - concept: DcLine
    type: EntityType
    iri: cim:DCLine
    description: Overhead lines and/or cables connecting two or more HVDC substations.
    extends:
      - DcEquipmentContainer
    relationships:
      - name: Region
        iri: cim:DCLine.Region
        description: The SubGeographicalRegion containing the DC line.
        roles:
          - concept: SubGeographicalRegion
        multiplicity: ManyToOne
        verbalizes:
          - "{DcLine} region {SubGeographicalRegion}"
  - concept: DcLineSegment
    type: EntityType
    iri: cim:DCLineSegment
    description: A wire or combination of wires not insulated from one another, with consistent electrical characteristics, used to carry direct current between points in the DC region of the power system.
    extends:
      - DcConductingEquipment
    requires:
      - DcLineSegment.capacitance
      - DcLineSegment.inductance
      - DcLineSegment.resistance
    relationships:
      - name: capacitance
        iri: cim:DCLineSegment.capacitance
        description: Capacitance of the DC line segment. Significant for cables only.
        roles:
          - concept: Capacitance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcLineSegment} capacitance {Capacitance}"
      - name: inductance
        iri: cim:DCLineSegment.inductance
        description: Inductance of the DC line segment. Negligible compared with DCSeriesDevice used for smoothing.
        roles:
          - concept: Inductance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcLineSegment} inductance {Inductance}"
      - name: length
        iri: cim:DCLineSegment.length
        description: Segment length for calculating line section capabilities.
        roles:
          - concept: Length
        multiplicity: ManyToOne
        verbalizes:
          - "{DcLineSegment} length {Length}"
      - name: resistance
        iri: cim:DCLineSegment.resistance
        description: Resistance of the DC line segment.
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcLineSegment} resistance {Resistance}"
  - concept: DcNode
    type: EntityType
    iri: cim:DCNode
    description: DC nodes are points where terminals of DC conducting equipment are connected together with zero impedance.
    extends:
      - IdentifiedObject
    requires:
      - DcNode.DCEquipmentContainer
    relationships:
      - name: DCEquipmentContainer
        iri: cim:DCNode.DCEquipmentContainer
        description: The DC container for the DC nodes.
        roles:
          - concept: DcEquipmentContainer
        multiplicity: ManyToOne
        verbalizes:
          - "{DcNode} dc equipment container {DcEquipmentContainer}"
      - name: DCTerminals
        iri: cim:DCNode.DCTerminals
        description: DC base terminals interconnected with zero impedance at a this DC connectivity node.
        roles:
          - concept: DcBaseTerminal
        verbalizes:
          - "{DcNode} dc terminals {DcBaseTerminal}"
  - concept: DcSeriesDevice
    type: EntityType
    iri: cim:DCSeriesDevice
    description: A series device within the DC system, typically a reactor used for filtering or smoothing.  Needed for transient and short circuit studies.
    extends:
      - DcConductingEquipment
    requires:
      - DcSeriesDevice.inductance
      - DcSeriesDevice.resistance
    relationships:
      - name: inductance
        iri: cim:DCSeriesDevice.inductance
        description: Inductance of the device.
        roles:
          - concept: Inductance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcSeriesDevice} inductance {Inductance}"
      - name: resistance
        iri: cim:DCSeriesDevice.resistance
        description: Resistance of the DC device.
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcSeriesDevice} resistance {Resistance}"
  - concept: DcShunt
    type: EntityType
    iri: cim:DCShunt
    description: A shunt device within the DC system, typically used for filtering.  Needed for transient and short circuit studies.
    extends:
      - DcConductingEquipment
    requires:
      - DcShunt.capacitance
      - DcShunt.resistance
    relationships:
      - name: capacitance
        iri: cim:DCShunt.capacitance
        description: Capacitance of the DC shunt.
        roles:
          - concept: Capacitance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcShunt} capacitance {Capacitance}"
      - name: resistance
        iri: cim:DCShunt.resistance
        description: Resistance of the DC device.
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{DcShunt} resistance {Resistance}"
  - concept: DcSwitch
    type: EntityType
    iri: cim:DCSwitch
    description: A switch within the DC system.
    extends:
      - DcConductingEquipment
  - concept: DcTerminal
    type: EntityType
    iri: cim:DCTerminal
    description: An electrical connection point to generic DC conducting equipment.
    extends:
      - DcBaseTerminal
    requires:
      - DcTerminal.DCConductingEquipment
    relationships:
      - name: DCConductingEquipment
        iri: cim:DCTerminal.DCConductingEquipment
        description: An DC  terminal belong to a DC conducting equipment.
        roles:
          - concept: DcConductingEquipment
        multiplicity: ManyToOne
        verbalizes:
          - "{DcTerminal} dc conducting equipment {DcConductingEquipment}"
  - concept: DayType
    type: EntityType
    iri: cim:DayType
    description: Group of similar days.   For example it could be used to represent weekdays, weekend, or holidays.
    extends:
      - IdentifiedObject
    relationships:
      - name: SeasonDayTypeSchedules
        iri: cim:DayType.SeasonDayTypeSchedules
        description: Schedules that use this DayType.
        roles:
          - concept: SeasonDayTypeSchedule
        verbalizes:
          - "{DayType} season day type schedules {SeasonDayTypeSchedule}"
  - concept: DisconnectingCircuitBreaker
    type: EntityType
    iri: cim:DisconnectingCircuitBreaker
    description: A circuit breaking device including disconnecting function, eliminating the need for separate disconnectors.
    extends:
      - Breaker
  - concept: Disconnector
    type: EntityType
    iri: cim:Disconnector
    description: A manually operated or motor operated mechanical switching device used for changing the connections in a circuit, or for isolating a circuit or equipment from a source of power. It is required to open or close circuits when negligible current is broken or made.
    extends:
      - Switch
  - concept: EarthFaultCompensator
    type: EntityType
    iri: cim:EarthFaultCompensator
    description: A conducting equipment used to represent a connection to ground which is typically used to compensate earth faults.   An earth fault compensator device modelled with a single terminal implies a second terminal solidly connected to ground.  If two terminals are modelled, the ground is not assumed and normal connection rules apply.
    extends:
      - ConductingEquipment
  - concept: EnergyArea
    type: EntityType
    iri: cim:EnergyArea
    description: Describes an area having energy production or consumption.  Specializations are intended to support the load allocation function as typically required in energy management systems or planning studies to allocate hypothesized load levels to individual load points for power flow analysis.  Often the energy area can be linked to both measured and forecast load levels.
    extends:
      - IdentifiedObject
    relationships:
      - name: ControlArea
        iri: cim:EnergyArea.ControlArea
        description: The control area specification that is used for the load forecast.
        roles:
          - concept: ControlArea
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergyArea} control area {ControlArea}"
  - concept: EnergyConnection
    type: EntityType
    iri: cim:EnergyConnection
    description: A connection of energy generation or consumption on the power system model.
    extends:
      - ConductingEquipment
  - concept: EnergyConsumer
    type: EntityType
    iri: cim:EnergyConsumer
    description: "Generic user of energy - a  point of consumption on the power system model.\nEnergyConsumer.pfixed, .qfixed, .pfixedPct and .qfixedPct have meaning only if there is no LoadResponseCharacteristic associated with EnergyConsumer or if LoadResponseCharacteristic.exponentModel is set to False."
    extends:
      - EnergyConnection
    relationships:
      - name: LoadResponse
        iri: cim:EnergyConsumer.LoadResponse
        description: The load response characteristic of this load.  If missing, this load is assumed to be constant power.
        roles:
          - concept: LoadResponseCharacteristic
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergyConsumer} load response {LoadResponseCharacteristic}"
      - name: pfixed
        iri: cim:EnergyConsumer.pfixed
        description: Active power of the load that is a fixed quantity and does not vary as load group value varies. Load sign convention is used, i.e. positive sign means flow out from a node.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergyConsumer} pfixed {ActivePower}"
      - name: pfixedPct
        iri: cim:EnergyConsumer.pfixedPct
        description: Fixed active power as a percentage of load group fixed active power. Used to represent the time-varying components.  Load sign convention is used, i.e. positive sign means flow out from a node.
        roles:
          - concept: PerCent
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergyConsumer} pfixed pct {PerCent}"
      - name: qfixed
        iri: cim:EnergyConsumer.qfixed
        description: Reactive power of the load that is a fixed quantity and does not vary as load group value varies. Load sign convention is used, i.e. positive sign means flow out from a node.
        roles:
          - concept: ReactivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergyConsumer} qfixed {ReactivePower}"
      - name: qfixedPct
        iri: cim:EnergyConsumer.qfixedPct
        description: Fixed reactive power as a percentage of load group fixed reactive power. Used to represent the time-varying components.  Load sign convention is used, i.e. positive sign means flow out from a node.
        roles:
          - concept: PerCent
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergyConsumer} qfixed pct {PerCent}"
  - concept: EnergySchedulingType
    type: EntityType
    iri: cim:EnergySchedulingType
    description: Used to define the type of generation for scheduling purposes.
    extends:
      - IdentifiedObject
    relationships:
      - name: EnergySource
        iri: cim:EnergySchedulingType.EnergySource
        description: Energy Source of a particular Energy Scheduling Type.
        roles:
          - concept: EnergySource
        verbalizes:
          - "{EnergySchedulingType} energy source {EnergySource}"
  - concept: EnergySource
    type: EntityType
    iri: cim:EnergySource
    description: A generic equivalent for an energy supplier on a transmission or distribution voltage level.
    extends:
      - EnergyConnection
    relationships:
      - name: EnergySchedulingType
        iri: cim:EnergySource.EnergySchedulingType
        description: Energy Scheduling Type of an Energy Source.
        roles:
          - concept: EnergySchedulingType
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergySource} energy scheduling type {EnergySchedulingType}"
      - name: nominalVoltage
        iri: cim:EnergySource.nominalVoltage
        description: Phase-to-phase nominal voltage.
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergySource} nominal voltage {Voltage}"
      - name: pMax
        iri: cim:EnergySource.pMax
        description: This is the maximum active power that can be produced by the source. Load sign convention is used, i.e. positive sign means flow out from a TopologicalNode (bus) into the conducting equipment.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergySource} p max {ActivePower}"
      - name: pMin
        iri: cim:EnergySource.pMin
        description: This is the minimum active power that can be produced by the source. Load sign convention is used, i.e. positive sign means flow out from a TopologicalNode (bus) into the conducting equipment.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EnergySource} p min {ActivePower}"
  - concept: Equipment
    type: EntityType
    iri: cim:Equipment
    description: The parts of a power system that are physical devices, electronic or mechanical.
    extends:
      - PowerSystemResource
    relationships:
      - name: EquipmentContainer
        iri: cim:Equipment.EquipmentContainer
        description: Container of this equipment.
        roles:
          - concept: EquipmentContainer
        multiplicity: ManyToOne
        verbalizes:
          - "{Equipment} equipment container {EquipmentContainer}"
      - name: OperationalLimitSet
        iri: cim:Equipment.OperationalLimitSet
        description: The operational limit sets associated with this equipment.
        roles:
          - concept: OperationalLimitSet
        verbalizes:
          - "{Equipment} operational limit set {OperationalLimitSet}"
      - name: aggregate
        iri: cim:Equipment.aggregate
        description: "The aggregate flag provides an alternative way of representing an aggregated (equivalent) element. It is applicable in cases when the dedicated classes for equivalent equipment do not have all of the attributes necessary to represent the required level of detail.  In case the flag is set to “true” the single instance of equipment represents multiple pieces of equipment that have been modelled together as an aggregate equivalent obtained by a network reduction procedure. Examples would be power transformers or synchronous machines operating in parallel modelled as a single aggregate power transformer or aggregate synchronous machine.  \nThe attribute is not used for EquivalentBranch, EquivalentShunt and EquivalentInjection."
        roles:
          - concept: Boolean
        multiplicity: ManyToOne
        verbalizes:
          - "{Equipment} aggregate {Boolean}"
      - name: normallyInService
        iri: cim:Equipment.normallyInService
        description: Specifies the availability of the equipment under normal operating conditions. True means the equipment is available for topology processing, which determines if the equipment is energized or not. False means that the equipment is treated by network applications as if it is not in the model.
        roles:
          - concept: Boolean
        multiplicity: ManyToOne
        verbalizes:
          - "{Equipment} normally in service {Boolean}"
  - concept: EquipmentContainer
    type: EntityType
    iri: cim:EquipmentContainer
    description: A modelling construct to provide a root class for containing equipment.
    extends:
      - ConnectivityNodeContainer
    relationships:
      - name: Equipments
        iri: cim:EquipmentContainer.Equipments
        description: Contained equipment.
        roles:
          - concept: Equipment
        verbalizes:
          - "{EquipmentContainer} equipments {Equipment}"
  - concept: EquivalentBranch
    type: EntityType
    iri: cim:EquivalentBranch
    description: The class represents equivalent branches. In cases where a transformer phase shift is modelled and the EquivalentBranch is spanning the same nodes, the impedance quantities for the EquivalentBranch shall consider the needed phase shift.
    extends:
      - EquivalentEquipment
    requires:
      - EquivalentBranch.r
      - EquivalentBranch.x
    relationships:
      - name: r
        iri: cim:EquivalentBranch.r
        description: Positive sequence series resistance of the reduced branch.
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentBranch} r {Resistance}"
      - name: r21
        iri: cim:EquivalentBranch.r21
        description: "Resistance from terminal sequence 2 to terminal sequence 1 .Used for steady state power flow. This attribute is optional and represent unbalanced network such as off-nominal phase shifter. If only EquivalentBranch.r is given, then EquivalentBranch.r21 is assumed equal to EquivalentBranch.r.\nUsage rule : EquivalentBranch is a result of network reduction prior to the data exchange."
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentBranch} r 21 {Resistance}"
      - name: x
        iri: cim:EquivalentBranch.x
        description: Positive sequence series reactance of the reduced branch.
        roles:
          - concept: Reactance
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentBranch} x {Reactance}"
      - name: x21
        iri: cim:EquivalentBranch.x21
        description: "Reactance from terminal sequence 2 to terminal sequence 1. Used for steady state power flow. This attribute is optional and represents an unbalanced network such as off-nominal phase shifter. If only EquivalentBranch.x is given, then EquivalentBranch.x21 is assumed equal to EquivalentBranch.x.\nUsage rule: EquivalentBranch is a result of network reduction prior to the data exchange."
        roles:
          - concept: Reactance
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentBranch} x 21 {Reactance}"
  - concept: EquivalentEquipment
    type: EntityType
    iri: cim:EquivalentEquipment
    description: The class represents equivalent objects that are the result of a network reduction. The class is the base for equivalent objects of different types.
    extends:
      - ConductingEquipment
    relationships:
      - name: EquivalentNetwork
        iri: cim:EquivalentEquipment.EquivalentNetwork
        description: The equivalent where the reduced model belongs.
        roles:
          - concept: EquivalentNetwork
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentEquipment} equivalent network {EquivalentNetwork}"
  - concept: EquivalentInjection
    type: EntityType
    iri: cim:EquivalentInjection
    description: This class represents equivalent injections (generation or load).  Voltage regulation is allowed only at the point of connection.
    extends:
      - EquivalentEquipment
    requires:
      - EquivalentInjection.regulationCapability
    relationships:
      - name: ReactiveCapabilityCurve
        iri: cim:EquivalentInjection.ReactiveCapabilityCurve
        description: The reactive capability curve used by this equivalent injection.
        roles:
          - concept: ReactiveCapabilityCurve
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentInjection} reactive capability curve {ReactiveCapabilityCurve}"
      - name: maxP
        iri: cim:EquivalentInjection.maxP
        description: Maximum active power of the injection.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentInjection} max p {ActivePower}"
      - name: maxQ
        iri: cim:EquivalentInjection.maxQ
        description: Maximum reactive power of the injection.  Used for modelling of infeed for load flow exchange. Not used for short circuit modelling.  If maxQ and minQ are not used ReactiveCapabilityCurve can be used.
        roles:
          - concept: ReactivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentInjection} max q {ReactivePower}"
      - name: minP
        iri: cim:EquivalentInjection.minP
        description: Minimum active power of the injection.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentInjection} min p {ActivePower}"
      - name: minQ
        iri: cim:EquivalentInjection.minQ
        description: Minimum reactive power of the injection.  Used for modelling of infeed for load flow exchange. Not used for short circuit modelling.  If maxQ and minQ are not used ReactiveCapabilityCurve can be used.
        roles:
          - concept: ReactivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentInjection} min q {ReactivePower}"
      - name: regulationCapability
        iri: cim:EquivalentInjection.regulationCapability
        description: Specifies whether or not the EquivalentInjection has the capability to regulate the local voltage. If true the EquivalentInjection can regulate. If false the EquivalentInjection cannot regulate. ReactiveCapabilityCurve can only be associated with EquivalentInjection  if the flag is true.
        roles:
          - concept: Boolean
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentInjection} regulation capability {Boolean}"
  - concept: EquivalentNetwork
    type: EntityType
    iri: cim:EquivalentNetwork
    description: A class that groups electrical equivalents, including internal nodes, of a network that has been reduced. The ConnectivityNodes contained in the equivalent are intended to reflect internal nodes of the equivalent. The boundary Connectivity nodes where the equivalent connects outside itself are not contained by the equivalent.
    extends:
      - ConnectivityNodeContainer
    relationships:
      - name: EquivalentEquipments
        iri: cim:EquivalentNetwork.EquivalentEquipments
        description: The associated reduced equivalents.
        roles:
          - concept: EquivalentEquipment
        verbalizes:
          - "{EquivalentNetwork} equivalent equipments {EquivalentEquipment}"
  - concept: EquivalentShunt
    type: EntityType
    iri: cim:EquivalentShunt
    description: The class represents equivalent shunts.
    extends:
      - EquivalentEquipment
    requires:
      - EquivalentShunt.b
      - EquivalentShunt.g
    relationships:
      - name: b
        iri: cim:EquivalentShunt.b
        description: Positive sequence shunt susceptance.
        roles:
          - concept: Susceptance
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentShunt} b {Susceptance}"
      - name: g
        iri: cim:EquivalentShunt.g
        description: Positive sequence shunt conductance.
        roles:
          - concept: Conductance
        multiplicity: ManyToOne
        verbalizes:
          - "{EquivalentShunt} g {Conductance}"
  - concept: ExternalNetworkInjection
    type: EntityType
    iri: cim:ExternalNetworkInjection
    description: This class represents the external network and it is used for IEC 60909 calculations.
    extends:
      - RegulatingCondEq
    requires:
      - ExternalNetworkInjection.governorSCD
      - ExternalNetworkInjection.maxP
      - ExternalNetworkInjection.maxQ
      - ExternalNetworkInjection.minP
      - ExternalNetworkInjection.minQ
    relationships:
      - name: governorSCD
        iri: cim:ExternalNetworkInjection.governorSCD
        description: Power Frequency Bias. This is the change in power injection divided by the change in frequency and negated.  A positive value of the power frequency bias provides additional power injection upon a drop in frequency.
        roles:
          - concept: ActivePowerPerFrequency
        multiplicity: ManyToOne
        verbalizes:
          - "{ExternalNetworkInjection} governor scd {ActivePowerPerFrequency}"
      - name: maxP
        iri: cim:ExternalNetworkInjection.maxP
        description: Maximum active power of the injection.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{ExternalNetworkInjection} max p {ActivePower}"
      - name: maxQ
        iri: cim:ExternalNetworkInjection.maxQ
        description: Maximum reactive power limit. It is used for modelling of infeed for load flow exchange and not for short circuit modelling.
        roles:
          - concept: ReactivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{ExternalNetworkInjection} max q {ReactivePower}"
      - name: minP
        iri: cim:ExternalNetworkInjection.minP
        description: Minimum active power of the injection.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{ExternalNetworkInjection} min p {ActivePower}"
      - name: minQ
        iri: cim:ExternalNetworkInjection.minQ
        description: Minimum reactive power limit. It is used for modelling of infeed for load flow exchange and not for short circuit modelling.
        roles:
          - concept: ReactivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{ExternalNetworkInjection} min q {ReactivePower}"
  - concept: FaultIndicator
    type: EntityType
    iri: cim:FaultIndicator
    description: A FaultIndicator is typically only an indicator (which may or may not be remotely monitored), and not a piece of equipment that actually initiates a protection event. It is used for FLISR (Fault Location, Isolation and Restoration) purposes, assisting with the dispatch of crews to "most likely" part of the network (i.e. assists with determining circuit section where the fault most likely happened).
    extends:
      - AuxiliaryEquipment
  - concept: FossilFuel
    type: EntityType
    iri: cim:FossilFuel
    description: The fossil fuel consumed by the non-nuclear thermal generating unit.   For example, coal, oil, gas, etc.   These are the specific fuels that the generating unit can consume.
    extends:
      - IdentifiedObject
    requires:
      - FossilFuel.ThermalGeneratingUnit
      - FossilFuel.fossilFuelType
    relationships:
      - name: ThermalGeneratingUnit
        iri: cim:FossilFuel.ThermalGeneratingUnit
        description: A thermal generating unit may have one or more fossil fuels.
        roles:
          - concept: ThermalGeneratingUnit
        multiplicity: ManyToOne
        verbalizes:
          - "{FossilFuel} thermal generating unit {ThermalGeneratingUnit}"
      - name: fossilFuelType
        iri: cim:FossilFuel.fossilFuelType
        description: The type of fossil fuel, such as coal, oil, or gas.
        roles:
          - concept: FuelType
        multiplicity: ManyToOne
        verbalizes:
          - "{FossilFuel} fossil fuel type {FuelType}"
  - concept: Frequency
    type: EntityType
    iri: cim:Frequency
    description: Cycles per second.
    relationships:
      - name: multiplier
        iri: cim:Frequency.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
