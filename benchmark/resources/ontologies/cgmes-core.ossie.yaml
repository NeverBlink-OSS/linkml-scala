    relationships:
      - name: multiplier
        iri: cim:Voltage.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{Voltage} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:Voltage.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{Voltage} unit {UnitSymbol}"
      - name: value
        iri: cim:Voltage.value
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{Voltage} value {Float}"
  - concept: VoltageLevel
    type: EntityType
    iri: cim:VoltageLevel
    description: A collection of equipment at one common system voltage forming a switchgear. The equipment typically consists of breakers, busbars, instrumentation, control, regulation and protection devices as well as assemblies of all these.
    extends:
      - EquipmentContainer
    requires:
      - VoltageLevel.BaseVoltage
      - VoltageLevel.Substation
    relationships:
      - name: BaseVoltage
        iri: cim:VoltageLevel.BaseVoltage
        description: The base voltage used for all equipment within the voltage level.
        roles:
          - concept: BaseVoltage
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltageLevel} base voltage {BaseVoltage}"
      - name: Bays
        iri: cim:VoltageLevel.Bays
        description: The bays within this voltage level.
        roles:
          - concept: Bay
        verbalizes:
          - "{VoltageLevel} bays {Bay}"
      - name: Substation
        iri: cim:VoltageLevel.Substation
        description: The substation of the voltage level.
        roles:
          - concept: Substation
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltageLevel} substation {Substation}"
      - name: highVoltageLimit
        iri: cim:VoltageLevel.highVoltageLimit
        description: "The bus bar's high voltage limit.\nThe limit applies to all equipment and nodes contained in a given VoltageLevel. It is not required that it is exchanged in pair with lowVoltageLimit. It is preferable to use operational VoltageLimit, which prevails, if present."
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltageLevel} high voltage limit {Voltage}"
      - name: lowVoltageLimit
        iri: cim:VoltageLevel.lowVoltageLimit
        description: "The bus bar's low voltage limit.\nThe limit applies to all equipment and nodes contained in a given VoltageLevel. It is not required that it is exchanged in pair with highVoltageLimit. It is preferable to use operational VoltageLimit, which prevails, if present."
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltageLevel} low voltage limit {Voltage}"
  - concept: VoltageLimit
    type: EntityType
    iri: cim:VoltageLimit
    description: "Operational limit applied to voltage.\nThe use of operational VoltageLimit is preferred instead of limits defined at VoltageLevel. The operational VoltageLimits are used, if present."
    extends:
      - OperationalLimit
    requires:
      - VoltageLimit.normalValue
    relationships:
      - name: normalValue
        iri: cim:VoltageLimit.normalValue
        description: The normal limit on voltage. High or low limit nature of the limit depends upon the properties of the operational limit type. The attribute shall be a positive value or zero.
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltageLimit} normal value {Voltage}"
  - concept: VoltagePerReactivePower
    type: EntityType
    iri: cim:VoltagePerReactivePower
    description: Voltage variation with reactive power.
    relationships:
      - name: multiplier
        iri: cim:VoltagePerReactivePower.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltagePerReactivePower} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:VoltagePerReactivePower.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltagePerReactivePower} unit {UnitSymbol}"
      - name: value
        iri: cim:VoltagePerReactivePower.value
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{VoltagePerReactivePower} value {Float}"
  - concept: VsCapabilityCurve
    type: EntityType
    iri: cim:VsCapabilityCurve
    description: The P-Q capability curve for a voltage source converter, with P on X-axis and Qmin and Qmax on Y1-axis and Y2-axis.
    extends:
      - Curve
    relationships:
      - name: VsConverterDCSides
        iri: cim:VsCapabilityCurve.VsConverterDCSides
        description: All converters with this capability curve.
        roles:
          - concept: VsConverter
        verbalizes:
          - "{VsCapabilityCurve} vs converter dc sides {VsConverter}"
  - concept: VsConverter
    type: EntityType
    iri: cim:VsConverter
    description: DC side of the voltage source converter (VSC).
    extends:
      - AcdcConverter
    relationships:
      - name: CapabilityCurve
        iri: cim:VsConverter.CapabilityCurve
        description: Capability curve of this converter.
        roles:
          - concept: VsCapabilityCurve
        multiplicity: ManyToOne
        verbalizes:
          - "{VsConverter} capability curve {VsCapabilityCurve}"
      - name: maxModulationIndex
        iri: cim:VsConverter.maxModulationIndex
        description: The maximum quotient between the AC converter voltage (Uc) and DC voltage (Ud). A factor typically less than 1. It is converter’s configuration data used in power flow.
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{VsConverter} max modulation index {Float}"
  - concept: WaveTrap
    type: EntityType
    iri: cim:WaveTrap
    description: Line traps are devices that impede high frequency power line carrier signals yet present a negligible impedance at the main power frequency.
    extends:
      - AuxiliaryEquipment
  - concept: WindGeneratingUnit
    type: EntityType
    iri: cim:WindGeneratingUnit
    description: A wind driven generating unit, connected to the grid by means of a rotating machine.  May be used to represent a single turbine or an aggregation.
    extends:
      - GeneratingUnit
    requires:
      - WindGeneratingUnit.windGenUnitType
    relationships:
      - name: WindPowerPlant
        iri: eu:WindGeneratingUnit.WindPowerPlant
        description: A wind power plant may have wind generating units.
        roles:
          - concept: WindPowerPlant
        multiplicity: ManyToOne
        verbalizes:
          - "{WindGeneratingUnit} wind power plant {WindPowerPlant}"
      - name: windGenUnitType
        iri: cim:WindGeneratingUnit.windGenUnitType
        description: The kind of wind generating unit.
        roles:
          - concept: WindGenUnitKind
        multiplicity: ManyToOne
        verbalizes:
          - "{WindGeneratingUnit} wind gen unit type {WindGenUnitKind}"
  - concept: WindPowerPlant
    type: EntityType
    iri: eu:WindPowerPlant
    description: Wind power plant.
    extends:
      - PowerSystemResource
    relationships:
      - name: WindGeneratingUnits
        iri: eu:WindPowerPlant.WindGeneratingUnits
        description: A wind generating unit or units may be a member of a wind power plant.
        roles:
          - concept: WindGeneratingUnit
        verbalizes:
          - "{WindPowerPlant} wind generating units {WindGeneratingUnit}"
