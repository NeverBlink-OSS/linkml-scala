        multiplicity: ManyToOne
        verbalizes:
          - "{NonConformLoadSchedule} non conform load group {NonConformLoadGroup}"
  - concept: NonlinearShuntCompensator
    type: EntityType
    iri: cim:NonlinearShuntCompensator
    description: A non linear shunt compensator has bank or section admittance values that differ. The attributes g, b, g0 and b0 of the associated NonlinearShuntCompensatorPoint describe the total conductance and admittance of a NonlinearShuntCompensatorPoint at a section number specified by NonlinearShuntCompensatorPoint.sectionNumber.
    extends:
      - ShuntCompensator
    requires:
      - NonlinearShuntCompensator.NonlinearShuntCompensatorPoints
    relationships:
      - name: NonlinearShuntCompensatorPoints
        iri: cim:NonlinearShuntCompensator.NonlinearShuntCompensatorPoints
        description: All points of the non-linear shunt compensator.
        roles:
          - concept: NonlinearShuntCompensatorPoint
        verbalizes:
          - "{NonlinearShuntCompensator} nonlinear shunt compensator points {NonlinearShuntCompensatorPoint}"
  - concept: NonlinearShuntCompensatorPoint
    type: EntityType
    iri: cim:NonlinearShuntCompensatorPoint
    description: A non linear shunt compensator bank or section admittance value. The number of NonlinearShuntCompenstorPoint instances associated with a NonlinearShuntCompensator shall be equal to ShuntCompensator.maximumSections. ShuntCompensator.sections shall only be set to one of the NonlinearShuntCompenstorPoint.sectionNumber. There is no interpolation between NonlinearShuntCompenstorPoint-s.
    requires:
      - NonlinearShuntCompensatorPoint.NonlinearShuntCompensator
      - NonlinearShuntCompensatorPoint.b
      - NonlinearShuntCompensatorPoint.g
      - NonlinearShuntCompensatorPoint.sectionNumber
    relationships:
      - name: NonlinearShuntCompensator
        iri: cim:NonlinearShuntCompensatorPoint.NonlinearShuntCompensator
        description: Non-linear shunt compensator owning this point.
        roles:
          - concept: NonlinearShuntCompensator
        multiplicity: ManyToOne
        verbalizes:
          - "{NonlinearShuntCompensatorPoint} nonlinear shunt compensator {NonlinearShuntCompensator}"
      - name: b
        iri: cim:NonlinearShuntCompensatorPoint.b
        description: Positive sequence shunt (charging) susceptance per section.
        roles:
          - concept: Susceptance
        multiplicity: ManyToOne
        verbalizes:
          - "{NonlinearShuntCompensatorPoint} b {Susceptance}"
      - name: g
        iri: cim:NonlinearShuntCompensatorPoint.g
        description: Positive sequence shunt (charging) conductance per section.
        roles:
          - concept: Conductance
        multiplicity: ManyToOne
        verbalizes:
          - "{NonlinearShuntCompensatorPoint} g {Conductance}"
      - name: sectionNumber
        iri: cim:NonlinearShuntCompensatorPoint.sectionNumber
        description: The number of the section.
        roles:
          - concept: Integer
        multiplicity: ManyToOne
        verbalizes:
          - "{NonlinearShuntCompensatorPoint} section number {Integer}"
  - concept: NuclearGeneratingUnit
    type: EntityType
    iri: cim:NuclearGeneratingUnit
    description: A nuclear generating unit.
    extends:
      - GeneratingUnit
  - concept: OperationalLimit
    type: EntityType
    iri: cim:OperationalLimit
    description: "A value and normal value associated with a specific kind of limit. \nThe sub class value and normalValue attributes vary inversely to the associated OperationalLimitType.acceptableDuration (acceptableDuration for short).  \nIf a particular piece of equipment has multiple operational limits of the same kind (apparent power, current, etc.), the limit with the greatest acceptableDuration shall have the smallest limit value and the limit with the smallest acceptableDuration shall have the largest limit value.  Note: A large current can only be allowed to flow through a piece of equipment for a short duration without causing damage, but a lesser current can be allowed to flow for a longer duration."
    extends:
      - IdentifiedObject
    requires:
      - OperationalLimit.OperationalLimitSet
      - OperationalLimit.OperationalLimitType
    relationships:
      - name: OperationalLimitSet
        iri: cim:OperationalLimit.OperationalLimitSet
        description: The limit set to which the limit values belong.
        roles:
          - concept: OperationalLimitSet
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimit} operational limit set {OperationalLimitSet}"
      - name: OperationalLimitType
        iri: cim:OperationalLimit.OperationalLimitType
        description: The limit type associated with this limit.
        roles:
          - concept: OperationalLimitType
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimit} operational limit type {OperationalLimitType}"
  - concept: OperationalLimitSet
    type: EntityType
    iri: cim:OperationalLimitSet
    description: A set of limits associated with equipment.  Sets of limits might apply to a specific temperature, or season for example. A set of limits may contain different severities of limit levels that would apply to the same equipment. The set may contain limits of different types such as apparent power and current limits or high and low voltage limits  that are logically applied together as a set.
    extends:
      - IdentifiedObject
    requires:
      - OperationalLimitSet.Terminal
    relationships:
      - name: Equipment
        iri: cim:OperationalLimitSet.Equipment
        description: The equipment to which the limit set applies.
        roles:
          - concept: Equipment
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimitSet} equipment {Equipment}"
      - name: OperationalLimitValue
        iri: cim:OperationalLimitSet.OperationalLimitValue
        description: Values of equipment limits.
        roles:
          - concept: OperationalLimit
        verbalizes:
          - "{OperationalLimitSet} operational limit value {OperationalLimit}"
      - name: Terminal
        iri: cim:OperationalLimitSet.Terminal
        description: The terminal where the operational limit set apply.
        roles:
          - concept: AcdcTerminal
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimitSet} terminal {AcdcTerminal}"
  - concept: OperationalLimitType
    type: EntityType
    iri: cim:OperationalLimitType
    description: The operational meaning of a category of limits.
    extends:
      - IdentifiedObject
    requires:
      - OperationalLimitType.direction
      - OperationalLimitType.isInfiniteDuration
      - OperationalLimitType.kind
    relationships:
      - name: OperationalLimit
        iri: cim:OperationalLimitType.OperationalLimit
        description: The operational limits associated with this type of limit.
        roles:
          - concept: OperationalLimit
        verbalizes:
          - "{OperationalLimitType} operational limit {OperationalLimit}"
      - name: acceptableDuration
        iri: cim:OperationalLimitType.acceptableDuration
        description: The nominal acceptable duration of the limit. Limits are commonly expressed in terms of the time limit for which the limit is normally acceptable. The actual acceptable duration of a specific limit may depend on other local factors such as temperature or wind speed. The attribute has meaning only if the flag isInfiniteDuration is set to false, hence it shall not be exchanged when isInfiniteDuration is set to true.
        roles:
          - concept: Seconds
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimitType} acceptable duration {Seconds}"
      - name: direction
        iri: cim:OperationalLimitType.direction
        description: The direction of the limit.
        roles:
          - concept: OperationalLimitDirectionKind
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimitType} direction {OperationalLimitDirectionKind}"
      - name: isInfiniteDuration
        iri: cim:OperationalLimitType.isInfiniteDuration
        description: Defines if the operational limit type has infinite duration. If true, the limit has infinite duration. If false, the limit has definite duration which is defined by the attribute acceptableDuration.
        roles:
          - concept: Boolean
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimitType} is infinite duration {Boolean}"
      - name: kind
        iri: eu:OperationalLimitType.kind
        description: Types of limits defined in the ENTSO-E Operational Handbook Policy 3.
        roles:
          - concept: LimitKind
        multiplicity: ManyToOne
        verbalizes:
          - "{OperationalLimitType} kind {LimitKind}"
  - concept: PerCent
    type: EntityType
    iri: cim:PerCent
    description: Percentage on a defined base.   For example, specify as 100 to indicate at the defined base.
    relationships:
      - name: multiplier
        iri: cim:PerCent.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{PerCent} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:PerCent.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{PerCent} unit {UnitSymbol}"
      - name: value
        iri: cim:PerCent.value
        description: Normally 0 to 100 on a defined base.
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{PerCent} value {Float}"
  - concept: PetersenCoil
    type: EntityType
    iri: cim:PetersenCoil
    description: A variable impedance device normally used to offset line charging during single line faults in an ungrounded section of network.
    extends:
      - EarthFaultCompensator
  - concept: PhaseTapChanger
    type: EntityType
    iri: cim:PhaseTapChanger
    description: A transformer phase shifting tap model that controls the phase angle difference across the power transformer and potentially the active power flow through the power transformer.  This phase tap model may also impact the voltage magnitude.
    extends:
      - TapChanger
    requires:
      - PhaseTapChanger.TransformerEnd
    relationships:
      - name: TransformerEnd
        iri: cim:PhaseTapChanger.TransformerEnd
        description: Transformer end to which this phase tap changer belongs.
        roles:
          - concept: TransformerEnd
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChanger} transformer end {TransformerEnd}"
  - concept: PhaseTapChangerAsymmetrical
    type: EntityType
    iri: cim:PhaseTapChangerAsymmetrical
    description: Describes the tap model for an asymmetrical phase shifting transformer in which the difference voltage vector adds to the in-phase winding. The out-of-phase winding is the transformer end where the tap changer is located.  The angle between the in-phase and out-of-phase windings is named the winding connection angle. The phase shift depends on both the difference voltage magnitude and the winding connection angle.
    extends:
      - PhaseTapChangerNonLinear
    requires:
      - PhaseTapChangerAsymmetrical.windingConnectionAngle
    relationships:
      - name: windingConnectionAngle
        iri: cim:PhaseTapChangerAsymmetrical.windingConnectionAngle
        description: The phase angle between the in-phase winding and the out-of -phase winding used for creating phase shift. The out-of-phase winding produces what is known as the difference voltage.  Setting this angle to 90 degrees is not the same as a symmetrical transformer. The attribute can only be multiples of 30 degrees.  The allowed range is -150 degrees to 150 degrees excluding 0.
        roles:
          - concept: AngleDegrees
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerAsymmetrical} winding connection angle {AngleDegrees}"
  - concept: PhaseTapChangerLinear
    type: EntityType
    iri: cim:PhaseTapChangerLinear
    description: "Describes a tap changer with a linear relation between the tap step and the phase angle difference across the transformer. This is a mathematical model that is an approximation of a real phase tap changer.\nThe phase angle is computed as stepPhaseShiftIncrement times the tap position.\nThe voltage magnitude of both sides is the same."
    extends:
      - PhaseTapChanger
    requires:
      - PhaseTapChangerLinear.stepPhaseShiftIncrement
      - PhaseTapChangerLinear.xMax
      - PhaseTapChangerLinear.xMin
    relationships:
      - name: stepPhaseShiftIncrement
        iri: cim:PhaseTapChangerLinear.stepPhaseShiftIncrement
        description: "Phase shift per step position. A positive value indicates a positive angle variation from the Terminal at the  PowerTransformerEnd,  where the TapChanger is located, into the transformer.\nThe actual phase shift increment might be more accurately computed from the symmetrical or asymmetrical models or a tap step table lookup if those are available."
        roles:
          - concept: AngleDegrees
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerLinear} step phase shift increment {AngleDegrees}"
      - name: xMax
        iri: cim:PhaseTapChangerLinear.xMax
        description: The reactance depends on the tap position according to a "u" shaped curve. The maximum reactance (xMax) appears at the low and high tap positions. Depending on the “u” curve the attribute can be either higher or lower than PowerTransformerEnd.x.
        roles:
          - concept: Reactance
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerLinear} x max {Reactance}"
      - name: xMin
        iri: cim:PhaseTapChangerLinear.xMin
        description: The reactance depends on the tap position according to a "u" shaped curve. The minimum reactance (xMin) appears at the mid tap position.  PowerTransformerEnd.x shall be consistent with PhaseTapChangerLinear.xMin and PhaseTapChangerNonLinear.xMin. In case of inconsistency, PowerTransformerEnd.x shall be used.
        roles:
          - concept: Reactance
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerLinear} x min {Reactance}"
  - concept: PhaseTapChangerNonLinear
    type: EntityType
    iri: cim:PhaseTapChangerNonLinear
    description: The non-linear phase tap changer describes the non-linear behaviour of a phase tap changer. This is a base class for the symmetrical and asymmetrical phase tap changer models. The details of these models can be found in IEC 61970-301.
    extends:
      - PhaseTapChanger
    requires:
      - PhaseTapChangerNonLinear.voltageStepIncrement
      - PhaseTapChangerNonLinear.xMax
      - PhaseTapChangerNonLinear.xMin
    relationships:
      - name: voltageStepIncrement
        iri: cim:PhaseTapChangerNonLinear.voltageStepIncrement
        description: "The voltage step increment on the out of phase winding (the PowerTransformerEnd where the TapChanger is located) specified in percent of rated voltage of the PowerTransformerEnd. A positive value means a positive voltage variation from the Terminal at the PowerTransformerEnd, where the TapChanger is located, into the transformer.\nWhen the increment is negative, the voltage decreases when the tap step increases."
        roles:
          - concept: PerCent
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerNonLinear} voltage step increment {PerCent}"
      - name: xMax
        iri: cim:PhaseTapChangerNonLinear.xMax
        description: The reactance depends on the tap position according to a "u" shaped curve. The maximum reactance (xMax) appears at the low and high tap positions. Depending on the “u” curve the attribute can be either higher or lower than PowerTransformerEnd.x.
        roles:
          - concept: Reactance
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerNonLinear} x max {Reactance}"
      - name: xMin
        iri: cim:PhaseTapChangerNonLinear.xMin
        description: The reactance depend on the tap position according to a "u" shaped curve. The minimum reactance (xMin) appear at the mid tap position.   PowerTransformerEnd.x shall be consistent with PhaseTapChangerLinear.xMin and PhaseTapChangerNonLinear.xMin. In case of inconsistency, PowerTransformerEnd.x shall be used.
        roles:
          - concept: Reactance
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerNonLinear} x min {Reactance}"
  - concept: PhaseTapChangerSymmetrical
    type: EntityType
    iri: cim:PhaseTapChangerSymmetrical
    description: Describes a symmetrical phase shifting transformer tap model in which the voltage magnitude of both sides is the same. The difference voltage magnitude is the base in an equal-sided triangle where the sides corresponds to the primary and secondary voltages. The phase angle difference corresponds to the top angle and can be expressed as twice the arctangent of half the total difference voltage.
    extends:
      - PhaseTapChangerNonLinear
  - concept: PhaseTapChangerTable
    type: EntityType
    iri: cim:PhaseTapChangerTable
    description: Describes a tabular curve for how the phase angle difference and impedance varies with the tap step.
    extends:
      - IdentifiedObject
    requires:
      - PhaseTapChangerTable.PhaseTapChangerTablePoint
    relationships:
      - name: PhaseTapChangerTablePoint
        iri: cim:PhaseTapChangerTable.PhaseTapChangerTablePoint
        description: The points of this table.
        roles:
          - concept: PhaseTapChangerTablePoint
        verbalizes:
          - "{PhaseTapChangerTable} phase tap changer table point {PhaseTapChangerTablePoint}"
      - name: PhaseTapChangerTabular
        iri: cim:PhaseTapChangerTable.PhaseTapChangerTabular
        description: The phase tap changers to which this phase tap table applies.
        roles:
          - concept: PhaseTapChangerTabular
        verbalizes:
          - "{PhaseTapChangerTable} phase tap changer tabular {PhaseTapChangerTabular}"
  - concept: PhaseTapChangerTablePoint
    type: EntityType
    iri: cim:PhaseTapChangerTablePoint
    description: Describes each tap step in the phase tap changer tabular curve.
    extends:
      - TapChangerTablePoint
    requires:
      - PhaseTapChangerTablePoint.PhaseTapChangerTable
      - PhaseTapChangerTablePoint.angle
    relationships:
      - name: PhaseTapChangerTable
        iri: cim:PhaseTapChangerTablePoint.PhaseTapChangerTable
        description: The table of this point.
        roles:
          - concept: PhaseTapChangerTable
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerTablePoint} phase tap changer table {PhaseTapChangerTable}"
      - name: angle
        iri: cim:PhaseTapChangerTablePoint.angle
        description: The angle difference in degrees. A positive value indicates a positive angle variation from the Terminal at the  PowerTransformerEnd,  where the TapChanger is located, into the transformer.
        roles:
          - concept: AngleDegrees
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerTablePoint} angle {AngleDegrees}"
  - concept: PhaseTapChangerTabular
    type: EntityType
    iri: cim:PhaseTapChangerTabular
    description: Describes a tap changer with a table defining the relation between the tap step and the phase angle difference across the transformer.
    extends:
      - PhaseTapChanger
    requires:
      - PhaseTapChangerTabular.PhaseTapChangerTable
    relationships:
      - name: PhaseTapChangerTable
        iri: cim:PhaseTapChangerTabular.PhaseTapChangerTable
        description: The phase tap changer table for this phase tap changer.
        roles:
          - concept: PhaseTapChangerTable
        multiplicity: ManyToOne
        verbalizes:
          - "{PhaseTapChangerTabular} phase tap changer table {PhaseTapChangerTable}"
  - concept: PhotoVoltaicUnit
    type: EntityType
    iri: cim:PhotoVoltaicUnit
    description: A photovoltaic device or an aggregation of such devices.
    extends:
      - PowerElectronicsUnit
  - concept: PostLineSensor
    type: EntityType
    iri: cim:PostLineSensor
