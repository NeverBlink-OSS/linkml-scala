      - name: ConverterDCSides
        iri: cim:Terminal.ConverterDCSides
        description: All converters' DC sides linked to this point of common coupling terminal.
        roles:
          - concept: AcdcConverter
        verbalizes:
          - "{Terminal} converter dc sides {AcdcConverter}"
      - name: RegulatingControl
        iri: cim:Terminal.RegulatingControl
        description: The controls regulating this terminal.
        roles:
          - concept: RegulatingControl
        verbalizes:
          - "{Terminal} regulating control {RegulatingControl}"
      - name: TieFlow
        iri: cim:Terminal.TieFlow
        description: The control area tie flows to which this terminal associates.
        roles:
          - concept: TieFlow
        verbalizes:
          - "{Terminal} tie flow {TieFlow}"
      - name: TransformerEnd
        iri: cim:Terminal.TransformerEnd
        description: All transformer ends connected at this terminal.
        roles:
