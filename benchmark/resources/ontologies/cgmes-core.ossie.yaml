    relationships:
      - name: ControlAreaGeneratingUnit
        iri: cim:GeneratingUnit.ControlAreaGeneratingUnit
        description: ControlArea specifications for this generating unit.
        roles:
          - concept: ControlAreaGeneratingUnit
        verbalizes:
          - "{GeneratingUnit} control area generating unit {ControlAreaGeneratingUnit}"
      - name: GrossToNetActivePowerCurves
        iri: cim:GeneratingUnit.GrossToNetActivePowerCurves
