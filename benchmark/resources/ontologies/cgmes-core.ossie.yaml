        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} maximum allowable spinning reserve {ActivePower}"
      - name: minOperatingP
        iri: cim:GeneratingUnit.minOperatingP
        description: This is the minimum operating active power limit the dispatcher can enter for this unit.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} min operating p {ActivePower}"
      - name: nominalP
        iri: cim:GeneratingUnit.nominalP
        description: "The nominal power of the generating unit.  Used to give precise meaning to percentage based attributes such as the governor speed change droop (governorSCD attribute).\nThe attribute shall be a positive value equal to or less than RotatingMachine.ratedS."
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} nominal p {ActivePower}"
      - name: ratedGrossMaxP
        iri: cim:GeneratingUnit.ratedGrossMaxP
        description: "The unit's gross rated maximum capacity (book value).\nThe attribute shall be a positive value."
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} rated gross max p {ActivePower}"
      - name: ratedGrossMinP
        iri: cim:GeneratingUnit.ratedGrossMinP
        description: "The gross rated minimum generation level which the unit can safely operate at while delivering power to the transmission grid.\nThe attribute shall be a positive value."
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} rated gross min p {ActivePower}"
      - name: ratedNetMaxP
        iri: cim:GeneratingUnit.ratedNetMaxP
        description: "The net rated maximum capacity determined by subtracting the auxiliary power used to operate the internal plant machinery from the rated gross maximum capacity.\nThe attribute shall be a positive value."
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} rated net max p {ActivePower}"
      - name: shortPF
        iri: cim:GeneratingUnit.shortPF
        description: Generating unit short term economic participation factor.
        roles:
