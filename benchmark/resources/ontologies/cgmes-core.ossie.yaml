version: 0.2.0.dev0
name: CoreEquipmentProfile
description: This vocabulary is describing the core equipment profile from IEC 61970-600-2.
prefixes:
  cim: http://iec.ch/TC57/CIM100#
  eu: http://iec.ch/TC57/CIM100-European#
ontology:
  - concept: AcdcConverter
    type: EntityType
    iri: cim:ACDCConverter
    description: A unit with valves for three phases, together with unit control equipment, essential protective and switching devices, DC storage capacitors, phase reactors and auxiliaries, if any, used for conversion.
    extends:
      - ConductingEquipment
    relationships:
      - name: DCTerminals
        iri: cim:ACDCConverter.DCTerminals
        description: A DC converter have DC converter terminals. A converter has two DC converter terminals.
        roles:
          - concept: AcdcConverterDcTerminal
        verbalizes:
          - "{AcdcConverter} dc terminals {AcdcConverterDcTerminal}"
      - name: PccTerminal
        iri: cim:ACDCConverter.PccTerminal
        description: Point of common coupling terminal for this converter DC side. It is typically the terminal on the power transformer (or switch) closest to the AC network.
        roles:
          - concept: Terminal
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} pcc terminal {Terminal}"
      - name: baseS
        iri: cim:ACDCConverter.baseS
        description: Base apparent power of the converter pole. The attribute shall be a positive value.
        roles:
          - concept: ApparentPower
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} base s {ApparentPower}"
      - name: idleLoss
        iri: cim:ACDCConverter.idleLoss
        description: Active power loss in pole at no power transfer. It is converter’s configuration data used in power flow. The attribute shall be a positive value.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} idle loss {ActivePower}"
      - name: maxP
        iri: cim:ACDCConverter.maxP
        description: Maximum active power limit. The value is overwritten by values of VsCapabilityCurve, if present.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} max p {ActivePower}"
      - name: maxUdc
        iri: cim:ACDCConverter.maxUdc
        description: The maximum voltage on the DC side at which the converter should operate. It is converter’s configuration data used in power flow. The attribute shall be a positive value.
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} max udc {Voltage}"
      - name: minP
        iri: cim:ACDCConverter.minP
        description: Minimum active power limit. The value is overwritten by values of VsCapabilityCurve, if present.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} min p {ActivePower}"
      - name: minUdc
        iri: cim:ACDCConverter.minUdc
        description: The minimum voltage on the DC side at which the converter should operate. It is converter’s configuration data used in power flow. The attribute shall be a positive value.
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} min udc {Voltage}"
      - name: numberOfValves
        iri: cim:ACDCConverter.numberOfValves
        description: Number of valves in the converter. Used in loss calculations.
        roles:
          - concept: Integer
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} number of valves {Integer}"
      - name: ratedUdc
        iri: cim:ACDCConverter.ratedUdc
        description: Rated converter DC voltage, also called UdN. The attribute shall be a positive value. It is converter’s configuration data used in power flow. For instance a bipolar HVDC link with value  200 kV has a 400kV difference between the dc lines.
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} rated udc {Voltage}"
      - name: resistiveLoss
        iri: cim:ACDCConverter.resistiveLoss
        description: It is converter’s configuration data used in power flow. Refer to poleLossP. The attribute shall be a positive value.
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} resistive loss {Resistance}"
      - name: switchingLoss
        iri: cim:ACDCConverter.switchingLoss
        description: Switching losses, relative to the base apparent power 'baseS'. Refer to poleLossP. The attribute shall be a positive value.
        roles:
          - concept: ActivePowerPerCurrentFlow
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} switching loss {ActivePowerPerCurrentFlow}"
      - name: valveU0
        iri: cim:ACDCConverter.valveU0
        description: Valve threshold voltage, also called Uvalve. Forward voltage drop when the valve is conducting. Used in loss calculations, i.e. the switchLoss depend on numberOfValves * valveU0.
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverter} valve u 0 {Voltage}"
  - concept: AcdcConverterDcTerminal
    type: EntityType
    iri: cim:ACDCConverterDCTerminal
    description: A DC electrical connection point at the AC/DC converter. The AC/DC converter is electrically connected also to the AC side. The AC connection is inherited from the AC conducting equipment in the same way as any other AC equipment. The AC/DC converter DC terminal is separate from generic DC terminal to restrict the connection with the AC side to AC/DC converter and so that no other DC conducting equipment can be connected to the AC side.
    extends:
      - DcBaseTerminal
    requires:
      - AcdcConverterDcTerminal.DCConductingEquipment
      - AcdcConverterDcTerminal.polarity
    relationships:
      - name: DCConductingEquipment
        iri: cim:ACDCConverterDCTerminal.DCConductingEquipment
        description: A DC converter terminal belong to an DC converter.
        roles:
          - concept: AcdcConverter
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverterDcTerminal} dc conducting equipment {AcdcConverter}"
      - name: polarity
        iri: cim:ACDCConverterDCTerminal.polarity
        description: "Represents the normal network polarity condition. Depending on the converter configuration the value shall be set as follows:\n- For a monopole with two converter terminals use DCPolarityKind “positive” and “negative”.\n- For a bi-pole or symmetric monopole with three converter terminals use DCPolarityKind “positive”, “middle” and “negative”."
        roles:
          - concept: DcPolarityKind
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcConverterDcTerminal} polarity {DcPolarityKind}"
  - concept: AcdcTerminal
    type: EntityType
    iri: cim:ACDCTerminal
    description: An electrical connection point (AC or DC) to a piece of conducting equipment. Terminals are connected at physical connection points called connectivity nodes.
    extends:
      - IdentifiedObject
    requires:
      - AcdcTerminal.sequenceNumber
    relationships:
      - name: BusNameMarker
        iri: cim:ACDCTerminal.BusNameMarker
        description: The bus name marker used to name the bus (topological node).
        roles:
          - concept: BusNameMarker
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcTerminal} bus name marker {BusNameMarker}"
      - name: OperationalLimitSet
        iri: cim:ACDCTerminal.OperationalLimitSet
        description: The operational limit sets at the terminal.
        roles:
          - concept: OperationalLimitSet
        verbalizes:
          - "{AcdcTerminal} operational limit set {OperationalLimitSet}"
      - name: sequenceNumber
        iri: cim:ACDCTerminal.sequenceNumber
        description: The orientation of the terminal connections for a multiple terminal conducting equipment.  The sequence numbering starts with 1 and additional terminals should follow in increasing order.   The first terminal is the "starting point" for a two terminal branch.
        roles:
          - concept: Integer
        multiplicity: ManyToOne
        verbalizes:
          - "{AcdcTerminal} sequence number {Integer}"
  - concept: AcLineSegment
    type: EntityType
    iri: cim:ACLineSegment
    description: "A wire or combination of wires, with consistent electrical characteristics, building a single electrical system, used to carry alternating current between points in the power system.\nFor symmetrical, transposed three phase lines, it is sufficient to use attributes of the line segment, which describe impedances and admittances for the entire length of the segment.  Additionally impedances can be computed by using length and associated per length impedances.\nThe BaseVoltage at the two ends of ACLineSegments in a Line shall have the same BaseVoltage.nominalVoltage. However, boundary lines may have slightly different BaseVoltage.nominalVoltages and variation is allowed. Larger voltage difference in general requires use of an equivalent branch."
    extends:
      - Conductor
    requires:
      - AcLineSegment.bch
      - AcLineSegment.r
      - AcLineSegment.x
    relationships:
      - name: Clamp
        iri: cim:ACLineSegment.Clamp
        description: The clamps connected to the line segment.
        roles:
          - concept: Clamp
        verbalizes:
          - "{AcLineSegment} clamp {Clamp}"
      - name: Cut
        iri: cim:ACLineSegment.Cut
        description: Cuts applied to the line segment.
        roles:
          - concept: Cut
        verbalizes:
          - "{AcLineSegment} cut {Cut}"
      - name: bch
        iri: cim:ACLineSegment.bch
        description: Positive sequence shunt (charging) susceptance, uniformly distributed, of the entire line section.  This value represents the full charging over the full length of the line.
        roles:
          - concept: Susceptance
        multiplicity: ManyToOne
        verbalizes:
          - "{AcLineSegment} bch {Susceptance}"
      - name: gch
        iri: cim:ACLineSegment.gch
        description: Positive sequence shunt (charging) conductance, uniformly distributed, of the entire line section.
        roles:
          - concept: Conductance
        multiplicity: ManyToOne
        verbalizes:
          - "{AcLineSegment} gch {Conductance}"
      - name: r
        iri: cim:ACLineSegment.r
        description: Positive sequence series resistance of the entire line section.
        roles:
          - concept: Resistance
        multiplicity: ManyToOne
        verbalizes:
          - "{AcLineSegment} r {Resistance}"
      - name: x
        iri: cim:ACLineSegment.x
        description: Positive sequence series reactance of the entire line section.
        roles:
          - concept: Reactance
        multiplicity: ManyToOne
        verbalizes:
          - "{AcLineSegment} x {Reactance}"
  - concept: ActivePower
    type: EntityType
    iri: cim:ActivePower
    description: Product of RMS value of the voltage and the RMS value of the in-phase component of the current.
    relationships:
      - name: multiplier
        iri: cim:ActivePower.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePower} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:ActivePower.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePower} unit {UnitSymbol}"
      - name: value
        iri: cim:ActivePower.value
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePower} value {Float}"
  - concept: ActivePowerLimit
    type: EntityType
    iri: cim:ActivePowerLimit
    description: Limit on active power flow.
    extends:
      - OperationalLimit
    requires:
      - ActivePowerLimit.normalValue
    relationships:
      - name: normalValue
        iri: cim:ActivePowerLimit.normalValue
        description: The normal value of active power limit. The attribute shall be a positive value or zero.
        roles:
          - concept: ActivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePowerLimit} normal value {ActivePower}"
  - concept: ActivePowerPerCurrentFlow
    type: EntityType
    iri: cim:ActivePowerPerCurrentFlow
    description: Active power variation with current flow.
    relationships:
      - name: multiplier
        iri: cim:ActivePowerPerCurrentFlow.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePowerPerCurrentFlow} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:ActivePowerPerCurrentFlow.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePowerPerCurrentFlow} unit {UnitSymbol}"
      - name: value
        iri: cim:ActivePowerPerCurrentFlow.value
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePowerPerCurrentFlow} value {Float}"
  - concept: ActivePowerPerFrequency
    type: EntityType
    iri: cim:ActivePowerPerFrequency
    description: Active power variation with frequency.
    relationships:
      - name: multiplier
        iri: cim:ActivePowerPerFrequency.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePowerPerFrequency} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:ActivePowerPerFrequency.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePowerPerFrequency} unit {UnitSymbol}"
      - name: value
        iri: cim:ActivePowerPerFrequency.value
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{ActivePowerPerFrequency} value {Float}"
  - concept: AngleDegrees
    type: EntityType
    iri: cim:AngleDegrees
    description: Measurement of angle in degrees.
    relationships:
      - name: multiplier
        iri: cim:AngleDegrees.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{AngleDegrees} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:AngleDegrees.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{AngleDegrees} unit {UnitSymbol}"
      - name: value
        iri: cim:AngleDegrees.value
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{AngleDegrees} value {Float}"
  - concept: ApparentPower
    type: EntityType
    iri: cim:ApparentPower
    description: Product of the RMS value of the voltage and the RMS value of the current.
    relationships:
      - name: multiplier
        iri: cim:ApparentPower.multiplier
        roles:
          - concept: UnitMultiplier
        multiplicity: ManyToOne
        verbalizes:
          - "{ApparentPower} multiplier {UnitMultiplier}"
      - name: unit
        iri: cim:ApparentPower.unit
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{ApparentPower} unit {UnitSymbol}"
      - name: value
        iri: cim:ApparentPower.value
        roles:
          - concept: Float
        multiplicity: ManyToOne
        verbalizes:
          - "{ApparentPower} value {Float}"
  - concept: ApparentPowerLimit
    type: EntityType
    iri: cim:ApparentPowerLimit
    description: Apparent power limit.
    extends:
      - OperationalLimit
    requires:
      - ApparentPowerLimit.normalValue
    relationships:
      - name: normalValue
        iri: cim:ApparentPowerLimit.normalValue
        description: The normal apparent power limit. The attribute shall be a positive value or zero.
        roles:
          - concept: ApparentPower
        multiplicity: ManyToOne
        verbalizes:
          - "{ApparentPowerLimit} normal value {ApparentPower}"
  - concept: AsynchronousMachine
    type: EntityType
    iri: cim:AsynchronousMachine
    description: A rotating machine whose shaft rotates asynchronously with the electrical field.  Also known as an induction machine with no external connection to the rotor windings, e.g. squirrel-cage induction machine.
    extends:
      - RotatingMachine
    relationships:
      - name: nominalFrequency
        iri: cim:AsynchronousMachine.nominalFrequency
        description: Nameplate data indicates if the machine is 50 Hz or 60 Hz.
        roles:
          - concept: Frequency
        multiplicity: ManyToOne
        verbalizes:
          - "{AsynchronousMachine} nominal frequency {Frequency}"
      - name: nominalSpeed
        iri: cim:AsynchronousMachine.nominalSpeed
        description: Nameplate data.  Depends on the slip and number of pole pairs.
        roles:
          - concept: RotationSpeed
        multiplicity: ManyToOne
        verbalizes:
          - "{AsynchronousMachine} nominal speed {RotationSpeed}"
  - concept: AuxiliaryEquipment
    type: EntityType
    iri: cim:AuxiliaryEquipment
    description: "AuxiliaryEquipment describe equipment that is not performing any primary functions but support for the equipment performing the primary function.\nAuxiliaryEquipment is attached to primary equipment via an association with Terminal."
    extends:
      - Equipment
    requires:
      - AuxiliaryEquipment.Terminal
    relationships:
      - name: Terminal
        iri: cim:AuxiliaryEquipment.Terminal
        description: The Terminal at the equipment where the AuxiliaryEquipment is attached.
        roles:
          - concept: Terminal
        multiplicity: ManyToOne
        verbalizes:
          - "{AuxiliaryEquipment} terminal {Terminal}"
  - concept: BaseVoltage
    type: EntityType
    iri: cim:BaseVoltage
    description: Defines a system base voltage which is referenced.
    extends:
      - IdentifiedObject
    requires:
      - BaseVoltage.nominalVoltage
    relationships:
      - name: ConductingEquipment
        iri: cim:BaseVoltage.ConductingEquipment
        description: All conducting equipment with this base voltage.  Use only when there is no voltage level container used and only one base voltage applies.  For example, not used for transformers.
        roles:
          - concept: ConductingEquipment
        verbalizes:
          - "{BaseVoltage} conducting equipment {ConductingEquipment}"
      - name: TransformerEnds
        iri: cim:BaseVoltage.TransformerEnds
        description: Transformer ends at the base voltage.  This is essential for PU calculation.
        roles:
          - concept: TransformerEnd
        verbalizes:
          - "{BaseVoltage} transformer ends {TransformerEnd}"
      - name: VoltageLevel
        iri: cim:BaseVoltage.VoltageLevel
        description: The voltage levels having this base voltage.
        roles:
          - concept: VoltageLevel
        verbalizes:
          - "{BaseVoltage} voltage level {VoltageLevel}"
      - name: nominalVoltage
        iri: cim:BaseVoltage.nominalVoltage
        description: The power system resource's base voltage.  Shall be a positive value and not zero.
        roles:
          - concept: Voltage
        multiplicity: ManyToOne
        verbalizes:
          - "{BaseVoltage} nominal voltage {Voltage}"
  - concept: BasicIntervalSchedule
    type: EntityType
    iri: cim:BasicIntervalSchedule
    description: Schedule of values at points in time.
    extends:
      - IdentifiedObject
    requires:
      - BasicIntervalSchedule.startTime
      - BasicIntervalSchedule.value1Unit
    relationships:
      - name: startTime
        iri: cim:BasicIntervalSchedule.startTime
        description: The time for the first time point.  The value can be a time of day, not a specific date.
        roles:
          - concept: Date
        multiplicity: ManyToOne
        verbalizes:
          - "{BasicIntervalSchedule} start time {Date}"
      - name: value1Unit
        iri: cim:BasicIntervalSchedule.value1Unit
        description: Value1 units of measure.
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{BasicIntervalSchedule} value 1 unit {UnitSymbol}"
      - name: value2Unit
        iri: cim:BasicIntervalSchedule.value2Unit
        description: Value2 units of measure.
        roles:
          - concept: UnitSymbol
        multiplicity: ManyToOne
        verbalizes:
          - "{BasicIntervalSchedule} value 2 unit {UnitSymbol}"
  - concept: BatteryUnit
    type: EntityType
    iri: cim:BatteryUnit
    description: An electrochemical energy storage device.
    extends:
      - PowerElectronicsUnit
    requires:
      - BatteryUnit.ratedE
    relationships:
      - name: ratedE
        iri: cim:BatteryUnit.ratedE
        description: Full energy storage capacity of the battery. The attribute shall be a positive value.
        roles:
          - concept: RealEnergy
        multiplicity: ManyToOne
        verbalizes:
          - "{BatteryUnit} rated e {RealEnergy}"
  - concept: Bay
    type: EntityType
    iri: cim:Bay
    description: A collection of power system resources (within a given substation) including conducting equipment, protection relays, measurements, and telemetry.  A bay typically represents a physical grouping related to modularization of equipment.
    extends:
      - EquipmentContainer
    requires:
      - Bay.VoltageLevel
    relationships:
      - name: VoltageLevel
        iri: cim:Bay.VoltageLevel
        description: The voltage level containing this bay.
        roles:
          - concept: VoltageLevel
        multiplicity: ManyToOne
        verbalizes:
          - "{Bay} voltage level {VoltageLevel}"
  - concept: BoundaryPoint
    type: EntityType
    iri: eu:BoundaryPoint
    description: Designates a connection point at which one or more model authority sets shall connect to. The location of the connection point as well as other properties are agreed between organisations responsible for the interconnection, hence all attributes of the class represent this agreement.  It is primarily used in a boundary model authority set which can contain one or many BoundaryPoint-s among other Equipment-s and their connections.
    extends:
      - PowerSystemResource
    requires:
      - BoundaryPoint.ConnectivityNode
      - BoundaryPoint.fromEndIsoCode
      - BoundaryPoint.fromEndName
      - BoundaryPoint.fromEndNameTso
      - BoundaryPoint.toEndIsoCode
      - BoundaryPoint.toEndName
      - BoundaryPoint.toEndNameTso
    relationships:
      - name: ConnectivityNode
        iri: eu:BoundaryPoint.ConnectivityNode
        description: The connectivity node that is designated as a boundary point.
        roles:
          - concept: ConnectivityNode
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} connectivity node {ConnectivityNode}"
      - name: fromEndIsoCode
        iri: eu:BoundaryPoint.fromEndIsoCode
        description: "The ISO code of the region which the \"From\" side of the Boundary point belongs to or it is connected to.\nThe ISO code is a two-character country code as defined by ISO 3166 (http://www.iso.org/iso/country_codes). The length of the string is 2 characters maximum."
        roles:
          - concept: String
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} from end iso code {String}"
      - name: fromEndName
        iri: eu:BoundaryPoint.fromEndName
        description: "A human readable name with length of the string 64 characters maximum. It covers the following two cases:\n-if the Boundary point is placed on a tie-line, it is the name (IdentifiedObject.name) of the substation at which the \"From\" side of the tie-line is connected to.\n-if the Boundary point is placed in a substation, it is the name (IdentifiedObject.name) of the element (e.g. PowerTransformer, ACLineSegment, Switch, etc.) at which the \"From\" side of the Boundary point is connected to."
        roles:
          - concept: String
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} from end name {String}"
      - name: fromEndNameTso
        iri: eu:BoundaryPoint.fromEndNameTso
        description: Identifies the name of the transmission system operator, distribution system operator or other entity at which the "From" side of the interconnection is connected to. The length of the string is 64 characters maximum.
        roles:
          - concept: String
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} from end name tso {String}"
      - name: isDirectCurrent
        iri: eu:BoundaryPoint.isDirectCurrent
        description: If true, this boundary point is a point of common coupling (PCC) of a direct current (DC) interconnection, otherwise the interconnection is AC (default).
        roles:
          - concept: Boolean
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} is direct current {Boolean}"
      - name: isExcludedFromAreaInterchange
        iri: eu:BoundaryPoint.isExcludedFromAreaInterchange
        description: If true, this boundary point is on the interconnection that is excluded from control area interchange calculation and consequently has no related tie flows. Otherwise, the interconnection is included in control area interchange and a TieFlow is required at all sides of the boundary point (default).
        roles:
          - concept: Boolean
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} is excluded from area interchange {Boolean}"
      - name: toEndIsoCode
        iri: eu:BoundaryPoint.toEndIsoCode
        description: "The ISO code of the region which the \"To\" side of the Boundary point belongs to or is connected to.\nThe ISO code is a two-character country code as defined by ISO 3166 (http://www.iso.org/iso/country_codes). The length of the string is 2 characters maximum."
        roles:
          - concept: String
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} to end iso code {String}"
      - name: toEndName
        iri: eu:BoundaryPoint.toEndName
        description: "A human readable name with length of the string 64 characters maximum. It covers the following two cases:\n-if the Boundary point is placed on a tie-line, it is the name (IdentifiedObject.name) of the substation at which the \"To\" side of the tie-line is connected to.\n-if the Boundary point is placed in a substation, it is the name (IdentifiedObject.name) of the element (e.g. PowerTransformer, ACLineSegment, Switch, etc.) at which the \"To\" side of the Boundary point is connected to."
        roles:
          - concept: String
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} to end name {String}"
      - name: toEndNameTso
        iri: eu:BoundaryPoint.toEndNameTso
        description: Identifies the name of the transmission system operator, distribution system operator or other entity at which the "To" side of the interconnection is connected to. The length of the string is 64 characters maximum.
        roles:
          - concept: String
        multiplicity: ManyToOne
        verbalizes:
          - "{BoundaryPoint} to end name tso {String}"
  - concept: Breaker
    type: EntityType
    iri: cim:Breaker
    description: A mechanical switching device capable of making, carrying, and breaking currents under normal circuit conditions and also making, carrying for a specified time, and breaking currents under specified abnormal circuit conditions e.g.  those of short circuit.
    extends:
      - ProtectedSwitch
  - concept: BusNameMarker
    type: EntityType
    iri: cim:BusNameMarker
    description: Used to apply user standard names to TopologicalNodes. Associated with one or more terminals that are normally connected with the bus name.    The associated terminals are normally connected by non-retained switches. For a ring bus station configuration, all BusbarSection terminals in the ring are typically associated.   For a breaker and a half scheme, both BusbarSections would normally be associated.  For a ring bus, all BusbarSections would normally be associated.  For a "straight" busbar configuration, normally only the main terminal at the BusbarSection would be associated.
    extends:
      - IdentifiedObject
    requires:
      - BusNameMarker.Terminal
    relationships:
