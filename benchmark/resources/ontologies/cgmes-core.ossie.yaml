        iri: cim:PowerElectronicsConnection.PowerElectronicsUnit
        description: An AC network connection may have several power electronics units connecting through it.
        roles:
          - concept: PowerElectronicsUnit
        multiplicity: ManyToOne
        verbalizes:
          - "{PowerElectronicsConnection} power electronics unit {PowerElectronicsUnit}"
      - name: maxQ
        iri: cim:PowerElectronicsConnection.maxQ
        description: Maximum reactive power limit. This is the maximum (nameplate) limit for the unit.
        roles:
          - concept: ReactivePower
        multiplicity: ManyToOne
        verbalizes:
          - "{PowerElectronicsConnection} max q {ReactivePower}"
      - name: minQ
        iri: cim:PowerElectronicsConnection.minQ
        description: Minimum reactive power limit for the unit. This is the minimum (nameplate) limit for the unit.
        roles:
