        multiplicity: ManyToOne
        verbalizes:
          - "{GeneratingUnit} startup time {Seconds}"
      - name: totalEfficiency
        iri: cim:GeneratingUnit.totalEfficiency
        description: The efficiency of the unit in converting the fuel into electrical energy.
        roles:
          - concept: PerCent
        multiplicity: ManyToOne
        verbalizes:
