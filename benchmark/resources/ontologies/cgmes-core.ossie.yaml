# Source: ../schemas/cgmes-core.yml, from https://github.com/Netbeheer-Nederland/cgmes/blob/bb2763d052185579241464791344038f3ba5ffd0/schemas/core-equipment.yaml, converted with `linkml-scala generate ossie`
# Original author: Netbeheer Nederland
