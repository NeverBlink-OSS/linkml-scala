        iri: cim:NonConformLoadGroup.NonConformLoadSchedules
        description: The NonConformLoadSchedules in the NonConformLoadGroup.
        roles:
          - concept: NonConformLoadSchedule
        verbalizes:
          - "{NonConformLoadGroup} non conform load schedules {NonConformLoadSchedule}"
  - concept: NonConformLoadSchedule
    type: EntityType
    iri: cim:NonConformLoadSchedule
    description: An active power (Y1-axis) and reactive power (Y2-axis) schedule (curves) versus time (X-axis) for non-conforming loads, e.g., large industrial load or power station service (where modelled).
    extends:
      - SeasonDayTypeSchedule
