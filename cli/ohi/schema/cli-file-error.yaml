id: https://ohi.neverblink.eu/contracts/cli-file-error
name: ohi_cli_file_error
title: CLI file delivery failure
description: Local file delivery or verification failure.
prefixes:
  ohi: https://ohi.neverblink.eu/contracts/
  linkml: https://w3id.org/linkml/
default_prefix: ohi
imports:
  - ../../../ohi/model/schema/operation-fields
classes:
  CliFileError:
    tree_root: true
    slots:
    - message
    - url
    - path
    slot_usage:
      url:
        required: true
    attributes:
      code:
        range: CliFileErrorCode
        required: true
      directory:
        description: Destination directory argument exactly as supplied.
        range: string
        required: true
      partial_path:
        description: Incomplete file retained after cleanup failed.
        range: string
enums:
  CliFileErrorCode:
    permissible_values:
      UNSUPPORTED_FILENAME:
        description: The URL does not provide a usable filename.
      INVALID_DESTINATION:
        description: The destination cannot be interpreted or created as a directory.
      DESTINATION_EXISTS:
        description: A file, directory or symbolic link already occupies the target path.
      FILE_WRITE_FAILED:
        description: The file could not be written.
      OUTPUT_CONFLICT:
        description: Incompatible files or filenames at one destination.
      HASH_MISMATCH:
        description: File contents do not match the lock's SHA-256.
      FILE_READ_FAILED:
        description: An existing file could not be checked.
