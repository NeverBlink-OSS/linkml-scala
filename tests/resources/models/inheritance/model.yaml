id: https://neverblink.eu/linkml/tests/inheritance/
name: inheritance

imports:
  - linkml:types

classes:
  BaseClass:
    slots:
      - some_other_slot
  ChildClass:
    tree_root: true
    is_a: BaseClass
    slots:
      - some_slot
      - yet_another_slot
  BaseRefClass:
    attributes:
      id:
        identifier: true
  RefClass:
    is_a: BaseRefClass
slots:
  some_slot:
    rank: 1
    range: string
  some_other_slot:
    rank: 2
    range: integer
    required: true
  yet_another_slot:
    rank: 3
    range: BaseRefClass
    required: true