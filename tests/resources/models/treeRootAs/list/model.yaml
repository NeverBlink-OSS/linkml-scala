id: https://neverblink.eu/linkml/tests/treeRootAs/list/
name: treeRootAsList
description: >-
  A document is a list of `SomeClass` objects, and may be empty (`tree_root_as: list`).

imports:
  - linkml:types

prefixes:
  root: https://neverblink.eu/linkml/tests/treeRootAs/

default_prefix: root

classes:
  SomeClass:
    tree_root: true
    extensions:
      tree_root_as: list
    attributes:
      key:
        range: string
        rank: 1
        key: true
      value:
        range: string
        rank: 2
        required: true
