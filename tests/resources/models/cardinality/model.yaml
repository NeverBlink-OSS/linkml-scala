id: https://neverblink.eu/linkml/tests/cardinality/
name: cardinality
imports:
  - linkml:types
prefixes:
  schema: http://schema.org/
  linkml: https://w3id.org/linkml/

classes:
  Cardinal:
    tree_root: true
    slots:
      - one
      - at_most_one
      - at_least_one
      - zero_or_more

slots:
  one:
    rank: 1
    range: string
    required: true
    multivalued: false
  at_most_one:
    rank: 2
    range: string
    required: false
    multivalued: false
  at_least_one:
    rank: 3
    range: string
    required: true
    multivalued: true
  zero_or_more:
    rank: 4
    range: string
    required: false
    multivalued: true