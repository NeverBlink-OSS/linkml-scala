id: https://neverblink.eu/linkml/tests/lengths/
name: lengths
prefixes:
  ex: https://example.org/
imports:
  - linkml:types

classes:
  Lengths:
    tree_root: true
    slots:
      - code
      - name
      - count
      - ref

slots:
  code:
    rank: 1
    range: short_code
    # Has precedence over the 4 of the type
    maximum_length: 3
  name:
    rank: 2
    range: string
    minimum_length: 1
  count:
    rank: 3
    range: integer
    # Lengths only apply to text, so this checks nothing
    minimum_length: 2
  ref:
    rank: 4
    range: uriorcurie
    # Checks the text in the data, not the full IRI it stands for
    maximum_length: 5

types:
  short_code:
    typeof: string
    minimum_length: 2
    maximum_length: 4
