id: https://neverblink.eu/linkml/tests/typed/
name: typed
imports:
  - linkml:types

classes:
  Typed:
    tree_root: true
    slots:
      - string_slot
      - boolean_slot
      - int_slot
      - float_slot
      - date_slot
      - custom_slot

types:
  custom:
    name: custom
    uri: https://neverblink.eu/linkml/tests/typed/Custom
    base: str

slots:
  string_slot:
    rank: 1
    range: string
    required: true
  boolean_slot:
    rank: 2
    range: boolean
    required: true
  int_slot:
    rank: 3
    range: integer
    required: true
  float_slot:
    rank: 4
    range: decimal
    required: true
  date_slot:
    rank: 5
    range: date
    required: true
  custom_slot:
    rank: 6
    range: custom
    required: true
