id: https://neverblink.eu/linkml/tests/equalsExpression/
name: equals_expression

imports:
  - linkml:types

classes:
  SomeClass:
    tree_root: true
    attributes:
      reference_value:
        range: string
      optional_message:
        range: string
        equals_expression: "Unknown reference to element '{reference_value}'"
      required_message:
        range: string
        required: true
        equals_expression: "ref is {reference_value}"
      required_source:
        range: string
        required: true
      from_required:
        range: string
        equals_expression: "{required_source} / {required_source}"
      literal_only:
        range: string
        equals_expression: "no substitutions here"
      with_escapes:
        range: string
        equals_expression: "braces {{like this}} and a \"quote\""
      no_expression:
        range: string
      # Reaching into inlined classes with dot notation
      optional_nested:
        range: Nested
        inlined: true
      required_nested:
        range: Nested
        inlined: true
        required: true
      from_optional_nested:
        range: string
        equals_expression: "{optional_nested.leaf}"
      from_required_nested:
        range: string
        equals_expression: "{required_nested.required_leaf} at {required_nested.deeper.bottom}"
      # Out of scope: not a single-valued string, so the expression must be ignored
      multivalued_ignored:
        range: string
        multivalued: true
        equals_expression: "{reference_value}"
      integer_ignored:
        range: integer
        equals_expression: "{reference_value}"

  Nested:
    attributes:
      leaf:
        range: string
      required_leaf:
        range: string
        required: true
      deeper:
        range: Deeper
        inlined: true

  Deeper:
    attributes:
      bottom:
        range: string
        required: true
